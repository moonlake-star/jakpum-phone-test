<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>나의 음악 여정 (샘플)</title>
<style>
  :root { --fz: 1; --bg:#0f1b33; --card:#1a2a4a; --ink:#f4f1ea; --sub:#c3cbe0; --gold:#f5c76a; --line:#33466e; }
  html { font-size:calc(18px * var(--fz)); }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans KR",sans-serif; line-height:1.5; }
  main { max-width:560px; margin:0 auto; padding:1rem; }
  h1 { font-size:1.4rem; margin:.2rem 0; }
  .sample { background:#5a4a1e; color:#ffe9a8; border-radius:.6rem; padding:.5rem .8rem; font-size:.85rem; margin:.5rem 0; }
  .card { background:var(--card); border-radius:1.2rem; padding:1rem; margin:.8rem 0; }
  nav { display:flex; gap:.5rem; }
  nav button, .chips button, .btn { min-height:3rem; padding:.5rem 1rem; border-radius:1rem; border:2px solid var(--line); background:transparent; color:var(--ink); font-size:1rem; }
  nav button[aria-pressed=true], .chips button[aria-pressed=true] { background:var(--gold); color:#2a1f05; border-color:var(--gold); }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0; }
  .bar { height:.9rem; background:#0b1428; border-radius:1rem; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--gold); }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem; }
  /* 메달(2026-10-29 Claude 시안): 둥근 금속 메달 + 분류별 따뜻한 색, 미획득은 회색 + 진행도 */
  .medal { border-radius:1.1rem; padding:.7rem .4rem; text-align:center; border:0; background:transparent; color:var(--ink); min-height:7.5rem; font-size:.95rem; line-height:1.3; }
  .medal .ic { position:relative; width:4.2rem; height:4.2rem; margin:0 auto .45rem; border-radius:50%; display:grid; place-items:center; font-size:2.1rem; }
  .medal .ic::after { content:""; position:absolute; inset:.25rem; border-radius:50%; border:1.5px dashed rgba(255,255,255,.4); }
  .medal.lesson .ic { background:radial-gradient(circle at 35% 30%,#ffe7a3,#c8912e 70%); box-shadow:0 0 0 3px #6b4d17; }
  .medal.mission .ic { background:radial-gradient(circle at 35% 30%,#cfe4ff,#4f7fc4 70%); box-shadow:0 0 0 3px #26416b; }
  .medal.note .ic { background:radial-gradient(circle at 35% 30%,#ffc7d6,#c4527a 70%); box-shadow:0 0 0 3px #6d2742; }
  .medal.teacher .ic { background:radial-gradient(circle at 35% 30%,#e6d4ff,#8458cf 70%); box-shadow:0 0 0 3px #43296f; }
  .medal.lock .ic { background:#253456; box-shadow:0 0 0 3px #3a4a70; filter:grayscale(1); opacity:.5; }
  .medal.lock .ic::after { border-color:rgba(255,255,255,.15); }
  .medal.lock b { color:var(--sub); }
  .medal span:not(.ic) { white-space:nowrap; }
  .medal .pg { color:var(--gold); font-weight:700; font-size:.85rem; }
  .medal:active .ic { transform:scale(.94); }
  .grid { grid-template-columns:repeat(3,1fr); gap:.4rem; }
  .card > .medal { display:block; margin:.3rem auto 0; }
  .hero .ic { width:6.5rem; height:6.5rem; font-size:3.4rem; margin:0 auto .6rem; }
  .muted { color:var(--sub); font-size:.9rem; }
  .big { font-size:1.6rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>나의 음악 여정</h1>
  <div class="sample" id="sampleBar">⚠️ 샘플 화면입니다. 숫자·날짜·녹음은 모두 가상 예시이고, 실제 수강생 기록이 아닙니다.</div>
  <div class="row"><nav aria-label="화면 선택">
    <button type="button" id="tabJourney" aria-pressed="true">여정</button>
    <button type="button" id="tabDrawer" aria-pressed="false">배지 서랍</button>
  </nav><button type="button" class="btn" id="fz" aria-label="글씨 크기 바꾸기">가 글씨</button></div>

  <section id="vJourney"></section>
  <section id="vDrawer" hidden></section>
  <section id="vDetail" hidden></section>
</main>
<script src="badges-logic.js"></script>
<script>
const B = window.Badges, player = B.createSinglePlayer();
let state = JSON.parse(JSON.stringify(B.DEMO)), cat = 'all', fzi = 0;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일';   // '10월 5일'(좁은 칸에서 줄바뀜 줄임)
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const show = (id) => { for (const v of ['vJourney', 'vDrawer', 'vDetail']) document.getElementById(v).hidden = v !== id;
  document.getElementById('tabJourney').setAttribute('aria-pressed', id === 'vJourney'); document.getElementById('tabDrawer').setAttribute('aria-pressed', id !== 'vJourney'); };
function medal(b) {
  const sub = b.earned ? fmt(b.date) : (b.progress ? b.progress.have + '/' + b.progress.need + b.progress.unit : '');
  return '<button type="button" class="medal ' + b.cat + ' ' + (b.earned ? 'got' : 'lock') + '" data-id="' + b.id + '"><span class="ic" aria-hidden="true">' + b.icon + '</span><b>' + esc(b.name) + '</b><br><span class="' + (b.earned ? 'muted' : 'pg') + '">' + (b.earned ? sub : b.progress ? '아직 ' + sub : '선생님이 드려요') + '</span></button>';
}
function renderJourney(r) {
  const t = r.title, nb = r.nextBadge;
  document.getElementById('vJourney').innerHTML =
    '<div class="card"><div class="muted">현재 칭호</div><div class="big">' + t.title.icon + ' ' + esc(t.title.name) + '</div>' +
    '<p>누적 레슨 <b>' + r.summary.lessons + '회</b> · 미션 해 옴 <b>' + r.summary.missions + '회</b> · 연속 완주 <b>' + r.bestStreak + '번</b></p>' +
    (t.next ? '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(t.progress * 100) + '"><i style="width:' + Math.round(t.progress * 100) + '%"></i></div>' +
      '<p class="muted">다음 칭호 ' + t.next.icon + ' ' + esc(t.next.name) + '까지 레슨 ' + t.remaining + '회</p>' : '<p class="muted">가장 높은 칭호예요. 칭호는 내려가지 않아요.</p>') + '</div>' +
    (nb ? '<div class="card"><div class="muted">다음에 얻을 수 있는 배지</div>' + medal(nb) + '</div>' : '') +
    '<div class="card"><div class="muted">최근 배지</div>' + (r.recent.length ? '<div class="grid">' + r.recent.map(medal).join('') + '</div>' : '<p>아직 없어요. 첫 레슨부터 시작해요.</p>') + '</div>' +
    '<p class="muted">순위·비교·점수 깎임은 없어요. 한 번 얻은 배지와 칭호는 계속 남아요.</p>';
}
function renderDrawer(r) {
  const cats = [['all', '전체']].concat(Object.entries(B.CATEGORIES));
  const list = r.badges.filter((b) => cat === 'all' || b.cat === cat);
  document.getElementById('vDrawer').innerHTML =
    '<div class="chips" role="group" aria-label="분류">' + cats.map(([k, v]) => '<button type="button" data-cat="' + k + '" aria-pressed="' + (cat === k) + '">' + v + '</button>').join('') + '</div>' +
    '<div class="grid">' + list.map(medal).join('') + '</div>';
}
function renderDetail(b) {
  const a = b.award, c = a && a.clip;
  let h = '<button type="button" class="btn" id="back">← 서랍으로</button><div class="card" style="text-align:center"><div class="medal hero ' + b.cat + ' ' + (b.earned ? 'got' : 'lock') + '" style="min-height:0;padding:0"><span class="ic" aria-hidden="true">' + b.icon + '</span></div><div class="big">' + esc(b.name) + '</div>' +
    '<div class="muted">' + (b.earned ? '획득 ' + fmt(b.date) : '아직 얻지 못했어요' + (b.progress ? ' (' + b.progress.have + '/' + b.progress.need + b.progress.unit + ')' : '')) + '</div></div>';
  if (b.kind === 'teacher' && a) {
    h += '<div class="card"><div class="muted">선생님 코멘트</div><p>' + esc(a.comment || '(코멘트 없음)') + '</p>' +
      (a.evidence ? '<p class="muted">근거: ' + esc(a.evidence) + '</p>' : '') + '</div>';
    h += c ? '<div class="card"><div class="muted">그 순간 녹음 ' + (c.sample ? '<b>(샘플 · 실제 음원 아님)</b>' : '') + '</div><p>' + esc(c.label || '') + ' · 시작 ' + mmss(c.start_s) + '</p>' +
      '<button type="button" class="btn" id="play" data-clip="' + b.id + '">▶ ' + mmss(c.start_s) + '부터 듣기</button><p class="muted" id="pst" role="status"></p></div>'
      : '<div class="card muted">연결된 녹음이 아직 없어요.</div>';
  } else if (b.kind === 'auto' && b.earned) h += '<div class="card muted">레슨·미션 기록으로 자동 획득했어요.</div>';
  document.getElementById('vDetail').innerHTML = h; show('vDetail');
}
function render() { const r = B.evaluate(state); renderJourney(r); renderDrawer(r); return r; }
document.addEventListener('click', (e) => {
  const r = B.evaluate(state), t = e.target.closest('button'); if (!t) return;
  if (t.id === 'tabJourney') show('vJourney'); else if (t.id === 'tabDrawer' || t.id === 'back') { player.stop(); show('vDrawer'); }
  else if (t.dataset.cat) { cat = t.dataset.cat; render(); }
  else if (t.dataset.id) renderDetail(r.badges.find((b) => b.id === t.dataset.id));
  else if (t.id === 'play') { const res = player.play(t.dataset.clip); document.getElementById('pst').textContent = '샘플 안내: 실제 음원이 연결되면 여기서 재생돼요. (' + res.playing + ')'; }
  else if (t.id === 'fz') { fzi = (fzi + 1) % 3; document.documentElement.style.setProperty('--fz', [1, 1.2, 1.4][fzi]); }
});
render(); show('vJourney');
</script>
</body>
</html>
