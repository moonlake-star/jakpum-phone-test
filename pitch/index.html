<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22282c">
<title>보컬노트 · 연습 천재</title>
<style>
:root{
  --bg:#1b2024; --surface:#22282c; --row:#2c3238; --line:#3a424a; --ink:#eef1f5; --ink2:#b6bfca; --muted:#8a95a1;
  --accent:#e48d16; --accent2:#d57c00; --accentInk:#1a1000; --ok:#4cc38a; --warn:#f2c14e; --bad:#ef6b5f; --target:#5cc8ff;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--ink)}
#app{height:100dvh;max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface)}
#top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--safe-t)) 14px 8px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:700;font-size:16px;letter-spacing:-.2px}
.brand small{font-weight:500;color:var(--muted);margin-left:6px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--row);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 24px}
.view.active{display:block}
#v-practice{padding:0;overflow:hidden}
#v-practice.active{display:flex;flex-direction:column}
#tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);font-size:11px}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}

/* practice */
.hud{flex:none;padding:8px 12px 6px;background:var(--surface)}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.mlabel{font-size:11px;color:var(--muted);width:34px}
.mlabel:last-of-type{text-align:right}
.mtrack{position:relative;height:6px;border-radius:3px;background:var(--row);border:1px solid var(--line)}
.mmid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:#5a646e}
#mdot{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:.25;transition:left .06s linear,background .1s}
#mdot.on{opacity:1}#mdot.good{background:var(--accent)}
.vm .meter,.vm #note{display:none}
#voAlive{display:none;align-items:center;gap:16px;justify-content:center;padding:26px 0 22px}
#v-practice.scaleView #voAlive{display:flex}#v-practice.scaleView .meter,#v-practice.scaleView #note,#v-practice.scaleView #centsTxt,#v-practice.scaleView #startBtn{display:none}#v-practice.scaleView .noteRow{min-height:22px}
.voMic{position:relative;width:96px;height:96px;border-radius:50%;background:#2c3238;border:2px solid #3a444c;display:flex;align-items:center;justify-content:center;color:#6b7580;transition:background .15s,color .15s,border-color .15s,transform .08s;flex:none}
.voMic svg{width:46px;height:46px;position:relative;z-index:1}
.voMic i{position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,192,77,.0);pointer-events:none}
#voAlive.on .voMic{background:#e48d16;border-color:#ffc04d;color:#1a1000;transform:scale(calc(1 + var(--l,0) * .12))}
#voAlive.on .voMic i{animation:voRing 1.1s ease-out infinite}#voAlive.on .voMic i+i{animation-delay:.55s}
@keyframes voRing{0%{inset:-2px;border-color:rgba(255,192,77,.7)}100%{inset:-20px;border-color:rgba(255,192,77,0)}}
.voTx{display:flex;flex-direction:column;gap:3px;min-width:0}.voTx b{font-size:18px;color:var(--ink)}.voTx span{font-size:13px;color:var(--muted)}#voAlive.on .voTx b{color:var(--accent)}.vm .noteRow{min-height:22px}
.noteRow{position:relative;display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:2px;min-height:34px}
.mon{position:absolute;left:-4px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);padding:6px;border-radius:8px;white-space:nowrap}
.mon i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5b6672;margin-right:5px;vertical-align:0}
.mon.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(76,195,138,.2)}
.mon.rec{color:var(--accent)}.mon.rec i{background:var(--accent);box-shadow:0 0 0 3px rgba(228,141,22,.25);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
#note{font-size:26px;font-weight:700;letter-spacing:-.5px;color:#fff;min-width:56px;text-align:center}
#note.good{color:var(--accent)}
#note.idle{color:var(--muted)}
#centsTxt{font-size:12px;color:var(--muted);min-width:64px}
.hudrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:2px;min-height:26px}
.stat{font-size:12px;color:var(--ink2)}.stat b{color:var(--ink);font-size:14px;margin-left:2px}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--target);border:1px dashed var(--target);border-radius:999px;padding:2px 4px 2px 10px}
.tchip[hidden]{display:none}
.tchip button{width:20px;height:20px;border-radius:50%;background:rgba(92,200,255,.15);color:var(--target);line-height:20px;font-size:11px}
#stage{flex:1;min-height:0;position:relative;background:var(--surface);touch-action:none}
#roll{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.dock{flex:none;padding:8px 12px 8px;background:var(--surface);border-top:1px solid var(--line)}
.goalbar{position:relative;height:20px;border-radius:10px;background:var(--row);overflow:hidden;border:1px solid var(--line)}
.goalbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.goalbar span{position:relative;display:block;text-align:center;font-size:11px;line-height:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.controls{display:flex;gap:8px;align-items:center;margin-top:8px}
.ibtn{flex:none;height:44px;padding:0 10px;border-radius:12px;background:var(--row);border:1px solid var(--line);color:var(--ink2);font-size:12px}
.ibtn:active{background:var(--line)}
.cta{flex:1;height:48px;border-radius:24px;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:16px;box-shadow:0 2px 0 var(--accent2)}
.cta:active{transform:translateY(1px)}
.cta.run{background:#3a2a10;color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.hint{margin:6px 0 0;font-size:11px;color:var(--muted);text-align:center}
#setPanel{display:none;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--row);font-size:12px;color:var(--ink2)}
#setPanel.open{display:block}
#setPanel input[type=range]{width:100%;accent-color:var(--accent)}
#setPanel.open{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:72vh;overflow:auto;margin:0;border-radius:18px 18px 0 0;padding:14px 16px 22px;background:#262d33;box-shadow:0 -10px 40px rgba(0,0,0,.55);border-top:1px solid var(--line)}
#setBack{display:none;position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.4)}#setBack.open{display:block}
.setHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;color:var(--ink);font-size:14px}
.sgroup{margin-top:10px}.sl{font-size:11px;color:var(--muted);margin-bottom:4px}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-width:0;height:32px;padding:0 4px;border-radius:8px;background:#1b2024;border:1px solid var(--line);color:var(--ink2);font-size:12px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:700}
#micPop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:90;max-width:300px;width:calc(100% - 48px);padding:20px 22px;border-radius:18px;background:rgba(16,20,24,.95);border:1px solid var(--line);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#micPop.show{opacity:1}#micPop b{display:block;font-size:19px;line-height:1.35}#micPop span{display:block;margin-top:6px;font-size:13px;color:var(--ink2);line-height:1.4}
#voicePop{position:fixed;inset:0;z-index:80;background:rgba(10,12,14,.84);display:flex;align-items:center;justify-content:center;padding:20px}
.vpc{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:center}
.vpc b{font-size:18px}.vpc .seg{margin-top:16px;gap:10px}.vpc .seg button{height:64px;font-size:20px;font-weight:700;border-radius:14px}
#cbar{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px 6px;background:var(--surface)}
.seg.big{width:100%;max-width:440px;gap:8px}.seg.big button{height:44px;font-size:17px;font-weight:700;border-radius:12px;letter-spacing:-.3px}
#subBar{display:flex;flex-wrap:wrap;justify-content:center;width:100%}
#recBox .rcRow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);min-height:48px}#recBox .rcRow:first-of-type{border-top:0}#recBox .rcRow input{width:22px;height:22px;flex:none;accent-color:var(--accent)}#recBox .rcRow .rcI{flex:1;font-size:14px;line-height:1.35}#recBox .rcRow .rcI small{display:block;color:var(--ink2);font-size:12px}#recBox .rcRow.sent{opacity:.65}#recBox .btn.full{width:100%;margin-top:10px}#recBox .btn[disabled]{opacity:.45}
#vwEx{cursor:pointer;width:100%;text-align:center;font-size:13px;color:var(--ink2);margin-top:5px}#vwEx b{color:var(--accent);font-size:16px;margin-right:4px}#vwEx[hidden]{display:none}
#segVW{width:100%;max-width:440px}#segVW[hidden]{display:none}#segVW button{height:34px;font-size:15px;font-weight:600;border-radius:10px}
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.scgrid button{height:auto;padding:8px 10px;text-align:left;border-radius:10px;background:#1b2024;border:1px solid var(--line);color:var(--ink2);font-size:13px;line-height:1.35}.scgrid button small{display:block;font-size:11px;color:var(--muted)}.scgrid button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.goBar{position:sticky;bottom:-14px;margin:10px -14px -24px;padding:10px 14px 12px;background:linear-gradient(to top,var(--surface) 70%,transparent)}
.scst{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}.scst .k{flex:1;color:var(--ink2)}.scst b{min-width:38px;text-align:center;color:var(--ink)}.scst button{width:34px;height:30px;border-radius:8px;background:#1b2024;border:1px solid var(--line);color:var(--ink);font-size:16px}
#stTabs{display:flex;gap:6px;justify-content:center;width:100%;max-width:440px}#stTabs[hidden]{display:none}
#stTabs button{flex:1;height:34px;padding:0 8px;border-radius:10px;font-size:15px;background:#1b2024;border:1px solid var(--line);color:var(--ink2)}
#stTabs button.on{border-color:var(--accent);color:var(--accent);font-weight:800}
#cOv{position:absolute;left:62px;right:8px;bottom:10px;z-index:3;pointer-events:none}
#pauseOv{position:absolute;left:0;right:0;top:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(18,22,26,.6)}#pauseOv[hidden]{display:none}
.pbox{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink)}.pbox b{font-size:15px}
#pauseOv .cgo2{width:104px;height:104px;border-radius:50%;padding:0;font-size:17px;font-weight:800;box-shadow:0 8px 26px rgba(0,0,0,.55),0 0 0 6px rgba(228,141,22,.22)}
#cOv.mid{left:0;right:0;top:50%;bottom:auto;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#cOv.mid .cgo{pointer-events:auto;width:112px;height:112px;border-radius:50%;padding:0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#2b1800;background:radial-gradient(circle at 34% 24%,#ffe0a0,#f4a722 52%,#c97a0b);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 10px 28px rgba(0,0,0,.55),0 0 0 7px rgba(244,167,34,.2),0 0 0 15px rgba(244,167,34,.08);animation:cpulse 2.6s ease-in-out infinite}
#cOv.mid .cgo .ic{font-size:34px;line-height:1;margin-left:4px}#cOv.mid .cgo .tx{font-size:15px;font-weight:800;letter-spacing:.04em}
#cOv.mid .cgo:active{transform:scale(.95)}
@keyframes cpulse{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 10px 28px rgba(0,0,0,.55),0 0 0 10px rgba(244,167,34,.14),0 0 0 22px rgba(244,167,34,.04)}}
@media (prefers-reduced-motion:reduce){#cOv.mid .cgo{animation:none}}
#scHead{display:none;width:100%;align-items:center;justify-content:space-between;gap:8px}#scHead b{flex:1;text-align:center;font-size:14px;color:var(--ink)}
#scBar{display:none;width:100%}#v-practice.scaleView #scHead{display:flex}#v-practice.scaleView #scBar:not(.hid){display:block}
.scBt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.scBt button{border:1px solid var(--line);background:#2a3036;color:#c9d1d8;border-radius:10px;padding:5px 2px 6px;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}.scBt button.on{background:#e48d16;border-color:#e48d16;color:#2a1a00;font-weight:700}.scBt svg{display:block}
#scBar .scSp{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;color:var(--ink)}#scBar .scSp b{min-width:92px;text-align:center;font-size:14px}#scBar .scSp button{width:38px;height:38px;border-radius:50%;background:#1b2024;border:1px solid var(--line);color:var(--ink);font-size:20px;line-height:1}#v-practice.scaleView #segMode{order:-1}#v-practice.scaleView .stats,#v-practice.scaleView #ctrack,#v-practice.scaleView #goalWrap{display:none}
#cOv.mid .cghost,#cOv.mid .cset{pointer-events:auto}
.qk{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;pointer-events:auto}.qk .seg{width:min(330px,88vw)}.qk .seg button{height:40px;font-size:14px;font-weight:600}
.qsp{display:flex;align-items:center;gap:10px;color:var(--ink)}.qsp b{min-width:92px;text-align:center;font-size:15px}.qsp button{width:46px;height:46px;border-radius:50%;background:#1b2024;border:1px solid var(--line);color:var(--ink);font-size:24px;line-height:1;padding:0}.qsp button:active{background:var(--accent);color:var(--accentInk)}
#pauseBtn{position:absolute;right:8px;top:8px;z-index:5;width:46px;height:46px;border-radius:50%;background:rgba(27,32,36,.78);border:1px solid var(--line);color:var(--ink);font-size:18px;padding:0}#pauseBtn[hidden]{display:none}
#cOv.mid .cghost,#cOv.mid .cset{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;margin:0}
#cOv.mid .cghost{background:rgba(24,29,33,.92);padding:4px 10px;border-radius:999px;top:calc(100% + 10px)}
#cOv.mid .cset{top:calc(100% + 10px)}
#cOv.mid .cghost+.cset{top:calc(100% + 46px)}
.ccard{pointer-events:auto;background:rgba(24,29,33,.95);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px}.crow b{font-size:14px;color:var(--ink)}
.cst{color:#ffd27a;letter-spacing:2px;font-size:15px}
.cghost{margin-top:6px;font-size:12px;color:#c9b6ff}
.seg.s2{margin-top:6px}.seg.s2 button{height:28px;font-size:11px}
.bigstars{display:flex;justify-content:center;gap:6px;font-size:38px;line-height:1;margin:2px 0 4px}
.bigstars i{font-style:normal;color:#3b444c}.bigstars i.on{color:#ffd27a;text-shadow:0 0 14px rgba(255,210,122,.8);animation:starIn .6s cubic-bezier(.2,1.6,.4,1) both}
.bigstars i:nth-child(2).on{animation-delay:.25s}.bigstars i:nth-child(3).on{animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#cprog .cline{height:18px;margin-top:-9px;border-radius:9px}
.cptxt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.cvs{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px}.cvs b{color:var(--ink)}.cvs .up{color:var(--ok)}.cvs .dn{color:#ff8a7a}
#ctrack{margin-bottom:10px}
.gmark{position:absolute;top:27px;font-size:11px;line-height:1;white-space:nowrap;pointer-events:none}.gmark small{font-size:9px;color:#c9b6ff;margin-left:2px}
.vsrow{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}.vsrow .k{flex:1;color:var(--ink2)}.vsrow .a{color:var(--muted)}.vsrow b{color:var(--ink)}
.vsrow em{font-style:normal;font-size:12px;min-width:46px;text-align:right}.vsrow em.up{color:var(--ok)}.vsrow em.dn{color:#ff8a7a}
#vibHud{display:none;margin:4px 16px 8px 6px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vk{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}.vk b{color:var(--ink);font-size:13px}
.vtrack{position:relative;height:8px;border-radius:4px;background:var(--row);margin-top:6px}
.vzone{position:absolute;top:0;bottom:0;border-radius:4px;background:rgba(76,195,138,.5)}
.vtrack u{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);text-decoration:none;transition:left .12s,opacity .2s}
.vstreak{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--ink2)}
.vp{display:flex;gap:5px}.vp i{width:12px;height:12px;border-radius:50%;border:1.5px solid #5b6672}.vp i.on{background:var(--accent);border-color:var(--accent)}
.vlad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:9px}
.vlad button{border-radius:8px;padding:5px 0 4px;text-align:center;font-size:10px;line-height:1.25;border:1px solid #3a424b;color:#8a95a1;background:#23282e;font-family:inherit;min-height:40px}
.vlad button b{display:block;font-size:12px;font-weight:600}
.vlad button.d{background:#3a2a0c;border-color:#e48d16;color:#ffd27a}.vlad button.c{background:#e48d16;border-color:#e48d16;color:#1a1204}
.vlad button.l{opacity:.55}
.vgd{display:flex;gap:6px;margin-top:8px;align-items:stretch}
.vgd button{border:1px solid #4a535d;background:#2a3036;color:#e8ecf1;border-radius:10px;padding:0 10px;font-size:12px;min-height:38px;font-family:inherit}
.vgd #vgB{min-width:84px}.vgd button.bp{animation:bpop .18s ease-out}.vgd button.bp1{animation:bpop1 .24s ease-out;background:#12323c;border-color:#7fe3ff;color:#7fe3ff}
@keyframes bpop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}@keyframes bpop1{0%{transform:scale(1)}35%{transform:scale(1.32)}100%{transform:scale(1)}}
.vgd button.on{background:#12323c;border-color:#7fe3ff;color:#7fe3ff}.vgd #vgT{flex:1}
.vstreak b{color:var(--ink);font-size:14px;min-width:14px}.vfb{margin-left:auto;font-size:11px;color:var(--muted);flex:1;min-width:0;text-align:right;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vstreak{height:34px;box-sizing:border-box}.vstreak>span:first-child{white-space:nowrap}.vfb.ok{color:var(--ok)}
@keyframes flashA{from{opacity:.95}to{opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 14px var(--fc,#ffd27a);animation:flashA .75s ease-out forwards;z-index:4}


/* game layer */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
.sx{display:flex;flex-direction:column;min-width:0;background:none;border:0;text-align:left;color:inherit;padding:0}
.sx .sk{font-size:10px;color:var(--muted);white-space:nowrap}
.sx b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.15}
.sx em{font-style:normal;font-size:11px;margin-left:4px;font-weight:700}
button.sx .sk{color:var(--accent)}
.ctrack{position:relative;height:30px;margin:4px 16px 0 6px}
.cline{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--row);border:1px solid var(--line);overflow:hidden}
.cline i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent2),#ffd27a);transition:width .1s linear}
.pip{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:11px;font-weight:800;line-height:20px;text-align:center;color:var(--muted)}
.pip.hit{background:var(--accent);border-color:#ffd27a;color:#1a1000;animation:pipPop .5s}
@keyframes pipPop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.tchip.ov{position:absolute;left:62px;top:40px;z-index:2;background:rgba(34,40,44,.88)}
.tchip small{font-size:10px;color:var(--ink2)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.mpop{position:absolute;left:50%;top:16%;text-align:center;white-space:nowrap;animation:mpop 1.5s ease-out forwards}
.mpop b{display:block;font-size:36px;font-weight:900;letter-spacing:-1px;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 20px currentColor}
.mpop span{display:block;font-size:15px;font-weight:800;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mpop small{display:block;font-size:11px;color:var(--ink2);margin-top:3px}
@keyframes mpop{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}12%{opacity:1;transform:translate(-50%,0) scale(1.18)}22%{transform:translate(-50%,0) scale(1)}78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-28px) scale(1)}}
.sheet.rep{display:flex;flex-direction:column;padding:0;overflow:hidden}
.repbody{flex:1;overflow:auto;padding:18px 16px 6px}
.repact{flex:none;padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--surface)}
.rep-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.rk{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#1a1000;flex:none}
.rk.S{background:radial-gradient(circle at 30% 25%,#fff3c4,#ffd27a 45%,#e48d16);box-shadow:0 0 0 4px rgba(255,210,122,.3),0 0 26px rgba(255,210,122,.45)}
.rk.A{background:radial-gradient(circle at 30% 25%,#ffd27a,var(--accent) 55%,var(--accent2));box-shadow:0 0 0 4px rgba(228,141,22,.25)}
.rk.B{background:linear-gradient(160deg,#9be0ff,#3b8fc4);box-shadow:0 0 0 4px rgba(92,200,255,.2)}
.rk.C{background:linear-gradient(160deg,#a8e6c4,#4cc38a);box-shadow:0 0 0 4px rgba(76,195,138,.2)}
.rep-avg{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1}
.delta{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;background:var(--row);color:var(--ink2)}
.delta.up{background:rgba(76,195,138,.15);color:var(--ok)}
.delta.dn{background:rgba(239,107,95,.15);color:var(--bad)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sgrid .tile .v{font-size:22px}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.cchip.on{background:rgba(228,141,22,.16);border-color:var(--accent);color:#ffd27a;font-weight:700}
.jbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.jbar i{display:block;height:100%}
.jl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.jl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chal{display:flex;gap:10px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.chal .ci{font-size:22px;flex:none;width:34px;text-align:center}
.chal b{display:block;font-size:14px}
.chal span{font-size:12px;color:var(--ink2)}
.cheerl{margin:0;padding:0;list-style:none}
.cheerl li{padding:3px 0;font-size:14px}

/* generic cards */
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:14px;margin:18px 0 8px;color:var(--ink2);font-weight:600}
.card{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.tile .s{font-size:11px;color:var(--ink2);margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#12161a;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;display:none;z-index:2}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}

.empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:10px;background:var(--row);border:1px solid var(--line);font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:700}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input[type=time],input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 10px}
label.t{display:flex;align-items:center;gap:8px}
.switch{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.note2{font-size:12px;color:var(--muted)}
.demoBar{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--surface2,#2b3238);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:12px;color:var(--ink2)}
details{margin-top:8px;font-size:13px;color:var(--ink2)}
summary{cursor:pointer;color:var(--ink2)}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.medal{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px;
  background:radial-gradient(circle at 30% 25%,#ffd27a,var(--accent) 55%,var(--accent2));box-shadow:0 0 0 3px rgba(228,141,22,.25)}
.badge.lock .medal{background:#2a3036;box-shadow:none;filter:grayscale(1);opacity:.45}
.badge .nm{font-weight:600;font-size:14px}
.badge .ds{font-size:11px;color:var(--muted);margin-top:2px;min-height:30px}
.badge .pg{font-size:11px;color:var(--accent);margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.next{display:flex;gap:12px;align-items:center}
.next .medal{margin:0;width:52px;height:52px;font-size:24px;flex:none}

/* roster */
.rcard{display:block;width:100%;text-align:left;background:var(--row);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.rtop{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.rname{font-weight:600}
.rsub{font-size:12px;color:var(--muted)}
.st{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.st.ok{background:rgba(76,195,138,.15);color:var(--ok)}
.st.part{background:rgba(242,193,78,.15);color:var(--warn)}
.st.no{background:rgba(239,107,95,.15);color:var(--bad)}
.rbot{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.mini{display:flex;gap:4px;align-items:flex-end;height:22px}
.mini i{display:block;width:8px;border-radius:2px 2px 0 0;background:#4a5560;min-height:2px}
.mini i.m{background:var(--accent)}
.demo{font-size:10px;background:var(--line);color:var(--ink2);padding:1px 6px;border-radius:6px;margin-left:6px;font-weight:500}

/* overlays */
#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);background:#0f1316;border:1px solid var(--line);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40}
#modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:86dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media(min-width:640px){#modal{align-items:center}.sheet{border-radius:18px}}
#banner{position:fixed;left:0;right:0;top:calc(52px + var(--safe-t));z-index:45;display:none;padding:0 12px}
#banner.open{display:block}
#banner .in{max-width:520px;margin:0 auto;background:#3a2a10;border:1px solid var(--accent);border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.big{font-size:42px;font-weight:800;letter-spacing:-1px;color:var(--accent);text-align:center}
.cheer{text-align:center;color:var(--ink2);margin:6px 0 12px}
.newb{display:flex;gap:10px;align-items:center;background:var(--row);border:1px solid var(--accent);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.newb .medal{width:44px;height:44px;font-size:22px;margin:0;flex:none}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.back{margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">보컬노트<small>연습 천재</small></div>
    <button id="userBtn" class="chip" aria-label="사용자 전환"></button>
  </header>
  <main id="main">
    <section id="v-practice" class="view active">
      <div class="hud">
        <div class="meter">
          <span class="mlabel">-50C</span>
          <div class="mtrack"><i class="mmid"></i><i id="mdot"></i></div>
          <span class="mlabel">+50C</span>
        </div>
        <div id="voAlive" aria-live="polite"><div class="voMic"><i></i><i></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/></svg></div><div class="voTx"><b id="voSt">시작하면 소리를 확인해요</b><span id="voTm">이번 0:00 · 오늘 0분</span></div></div>
        <div class="noteRow"><button id="monState" class="mon" aria-label="마이크 모니터 켜기/끄기"></button><span id="note" class="idle">--</span><span id="centsTxt"></span></div>
        <div class="stats">
          <button class="sx" id="sAvgBtn" aria-label="오늘 리포트 보기"><span class="sk">오늘 평균 ›</span><span><b id="sAvg">--</b><em id="sAvgD"></em></span></button>
          <div class="sx"><span class="sk">이번 점수</span><b id="liveScore">--</b></div>
          <div class="sx"><span class="sk">최고 유지</span><b id="sBest">0.0s</b></div>
          <div class="sx"><span class="sk">연습 시간</span><b id="liveTime">0:00</b></div>
        </div>
        <div class="ctrack" id="ctrack" aria-label="유지 챌린지 3초 5초 10초 15초 20초 30초"><div class="cline"><i id="cfill"></i></div></div>
        <div class="ctrack" id="cprog" style="display:none"><div class="cline"><i id="cpfill"></i></div><div class="cptxt" id="cptxt"></div></div>
        <div id="vibHud"><div class="vgrid">
          <div><div class="vk">속도 <b id="vRate">--</b></div><div class="vtrack"><i class="vzone" id="vRz"></i><u id="vRd"></u></div></div>
          <div><div class="vk">폭 (한쪽) <b id="vExt">--</b></div><div class="vtrack"><i class="vzone" id="vEz"></i><u id="vEd"></u></div></div></div>
          <div class="vstreak"><span>고른 사이클 연속</span><span class="vp" id="vPips"><i></i><i></i><i></i><i></i><i></i></span><b id="vCnt">0</b><span class="vfb" id="vFb"></span></div>
          <div class="vlad" id="vLad"></div>
          <div class="vgd"><button type="button" id="vgT" class="on">가이드 파형 켜짐</button><button type="button" id="vgD" aria-label="가이드 느리게">−</button><button type="button" id="vgU" aria-label="가이드 빠르게">＋</button><button type="button" id="vgB">▶ 박자</button></div></div>
      </div>
      <div id="cbar"><div id="scHead"><b id="scTitle"></b><button class="btn sm" id="scCfg" aria-label="시작음·브릿지 설정">⚙</button></div><div id="scBar"></div><div class="seg big" id="segMode"><button data-v="free">자유</button><button data-v="course">코스</button><button data-v="vib">비브라토</button><button data-v="scale">발성</button></div><div id="subBar"><div id="stTabs" hidden></div><div class="seg" id="segVW" hidden></div><div id="vwEx" hidden></div></div></div>
      <div id="stage"><canvas id="roll"></canvas>
        <div id="targetChip" class="tchip ov" hidden>목표음 <b id="targetName"></b><small>옥타브 무관</small><button id="targetClear" aria-label="목표음 해제">✕</button></div>

<script>
(() => {
'use strict';
/* ============ 수강생 앱 연결 ============
   수강생 앱(../student/)에서 '발성 연습' 버튼으로 열면(?from=student) 같은 사이트의 로그인 기록(sn_tok)으로 '내 계정' 모드가 돼요.
   - 샘플 사용자 없이 본인 한 명만, 기록은 이 폰의 별도 저장소(vn_pitch_me)에 쌓여요.
   - 날짜별 연습 요약(연습 시간·점수·최고 유지·코스 별)만 선생님 노트 서버(PORTAL_URL)로 보내요. 녹음·목소리는 저장도 전송도 안 해요. */
const PORTAL_URL = 'https://script.google.com/macros/s/AKfycbyxHvxn4VkX83JrcGK1bQqJivhUPktWNyJn_HRpSyIyQ-lVoXh0MNaps2PUmY_obwJTBQ/exec';
function snToken() {
  try {
    const t = JSON.parse(localStorage.getItem('sn_tok')), b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'), p = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b + '==='.slice((b.length + 3) % 4)), c => c.charCodeAt(0))));
    return p.exp * 1000 > Date.now() + 60000 ? { tok: t, name: String(p.name || '').slice(0, 20) } : null;
  } catch (e) { return null; }
}
const FROM_STUDENT = new URLSearchParams(location.search).get('from') === 'student', SN = FROM_STUDENT ? snToken() : null;
/* (11/05 사용자) 앱 안에서 열기: 선생님·수강생 앱이 이 화면을 전체 화면 창(iframe)으로 띄움(embed=1). 선생님은 as=teacher — 샘플 없이 본인 한 명, 기록은 이 폰에만 */
const EMB = new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window, TM = EMB && new URLSearchParams(location.search).get('as') === 'teacher';
if (FROM_STUDENT && !SN) {
  document.body.innerHTML = '<div style="max-width:420px;margin:18vh auto;padding:0 20px;text-align:center;color:#e8ecf1;font:16px/1.6 system-ui,sans-serif"><b style="font-size:19px">먼저 내 노트에서 로그인해 주세요</b><p style="color:#8a95a1">구글 로그인이 끝나야 발성 연습 기록이 선생님께 이어져요.</p><a href="../student/" style="display:inline-block;margin-top:8px;padding:12px 22px;border-radius:12px;background:#e48d16;color:#2b1800;font-weight:800;text-decoration:none">내 노트로 가기</a></div>';
  return;
}

    const t = s.st; if (t) { d.bestHold = Math.max(d.bestHold, t.bestHold || 0); d.maxCombo = Math.max(d.maxCombo, t.maxCombo || 0); d.j.p += t.perfect || 0; d.j.g += t.great || 0; d.j.o += t.good || 0; d.j.m += t.miss || 0; for (const k in d.hold) d.hold[k] += (t.hold && t.hold[k]) || 0; }

/* ============ pitch detection (YIN) ============ */
let cmBuf = null;
function yin(buf, sr, thr) {
  thr = thr || 0.15;
  const half = buf.length >> 1;
  const maxLag = Math.min(half - 1, Math.floor(sr / 70)), minLag = Math.max(2, Math.floor(sr / 1100));
  if (!cmBuf || cmBuf.length < maxLag + 2) cmBuf = new Float32Array(maxLag + 2);
  const cm = cmBuf; cm[0] = 1; let run = 0;
  for (let tau = 1; tau <= maxLag; tau++) {
    let s = 0; for (let i = 0; i < half; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    run += s; cm[tau] = run > 0 ? s * tau / run : 1;
  }
  let tau = -1;
  for (let t = minLag; t <= maxLag; t++) {
    if (cm[t] < thr) { while (t + 1 <= maxLag && cm[t + 1] < cm[t]) t++; tau = t; break; }
  }
  if (tau < 0) return null;
  const x0 = cm[tau - 1], x1 = cm[tau], x2 = tau + 1 <= maxLag ? cm[tau + 1] : x1;
  const den = x0 + x2 - 2 * x1, sh = den ? (x0 - x2) / (2 * den) : 0;
  return { freq: sr / (tau + clamp(sh, -1, 1)), clarity: 1 - x1 };
}

/* octave-jump filter: a single-frame jump of ~1 or 2 octaves that comes back is a detector error, not the voice.
   It is folded back to the octave of the stable pitch; a real octave move is accepted once it lasts OCT_MS. */
const OCT = { st: null, t: 0, t0: 0, k: 0, pend: null, pn: 0 }, OCT_MS = 320;
function octFix(m, now) {
  if (OCT.st != null && now - OCT.t > 500) { OCT.st = null; OCT.k = 0; OCT.pend = null; }
  if (m == null) return null;
  OCT.t = now;
  if (OCT.st == null) {                                   // note onset: wait for two agreeing frames (attack transients are the most error-prone)
    if (OCT.pend != null && Math.abs(m - OCT.pend) < 1.5) { OCT.st = m; OCT.pend = null; OCT.k = 0; return m; }
    OCT.pend = m; return null;
  }
  const d = m - OCT.st, k = Math.round(d / 12), r = d - 12 * k;
  if (k !== 0 && Math.abs(r) < 2.5) {                     // octave-like jump (±2.5 semitones around 1 or 2 octaves)
    if (OCT.k !== k) { OCT.k = k; OCT.t0 = now; }
    if (now - OCT.t0 >= OCT_MS) { OCT.st = m; OCT.k = 0; return m; }   // lasts > 0.3 s: the singer really moved
    const c = m - 12 * k; OCT.st += (c - OCT.st) * .5; return c;
  }
  if (Math.abs(d) > 12 && Math.abs(d) % 12 > 5.5 && Math.abs(d) % 12 < 8.5) {            // 12 + 7: third-harmonic mistake
    if (OCT.k !== 99) { OCT.k = 99; OCT.t0 = now; }
    if (now - OCT.t0 >= OCT_MS) { OCT.st = m; OCT.k = 0; return m; }
    return null;
  }
  OCT.k = 0; OCT.st += (m - OCT.st) * .5; return m;
}
function octReset() { OCT.st = null; OCT.k = 0; OCT.pend = null; CALM.v = null; }
/* calm smoothing for the on-screen pitch (time constant ~110 ms); leaps of more than 1.2 semitones pass through at once */
const CALM = { v: null, t: 0 };
function calm(v, now, dt) {
  if (v == null) { if (now - CALM.t > 250) CALM.v = null; return null; }
  if (CALM.v == null || now - CALM.t > 250 || Math.abs(v - CALM.v) > 1.2) CALM.v = v;
  else CALM.v += (v - CALM.v) * (1 - Math.exp(-dt / 110));
  CALM.t = now; return CALM.v;
}

/* ============ charts ============ */
function drawChart(host, c) {
  const W = Math.max(280, host.clientWidth || 320), H = 190, m = { l: 32, r: 12, t: 14, b: 22 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = c.days.length;
  const slot = iw / n;
  const x = i => c.kind === 'bar' ? m.l + slot * (i + .5) : m.l + (n > 1 ? i * (iw / (n - 1)) : iw / 2);
  const y = v => m.t + ih * (1 - (v - c.min) / (c.max - c.min));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.label)}">`;
  for (const t of c.ticks) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#343c44" stroke-width="1"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#8a95a1">${t}</text>`;
  for (let i = n - 1; i >= 0; i -= 7) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8a95a1">${fmtDay(c.days[i].day).split('(')[0]}</text>`;
  if (c.kind === 'bar') {
    c.days.forEach((d, i) => { if (!d.v) return; const bw = Math.min(14, slot - 3), x0 = x(i) - bw / 2, y0 = y(0), yt = y(Math.min(d.v, c.max)), r = Math.min(3, y0 - yt);
      s += `<path d="M${x0},${y0}V${yt + r}Q${x0},${yt} ${x0 + r},${yt}H${x0 + bw - r}Q${x0 + bw},${yt} ${x0 + bw},${yt + r}V${y0}Z" fill="${d.met ? '#e48d16' : '#5b6672'}"/>`; });
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(c.goal)}" y2="${y(c.goal)}" stroke="#eef1f5" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  } else {
    const pts = c.days.map((d, i) => d.v == null ? null : [x(i), y(d.v), d]).filter(Boolean);
    if (pts.length) {
      s += `<path d="M${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L')}" fill="none" stroke="#e48d16" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="#e48d16" stroke="#2c3238" stroke-width="2"/>`; });
      const l = pts[pts.length - 1]; s += `<text x="${Math.min(l[0], W - m.r - 6)}" y="${l[1] - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1f5">${l[2].v}</text>`;
    }
  }
  s += `<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="#eef1f5" stroke-opacity=".4" style="display:none"/></svg><div class="tip"></div>`;
  host.innerHTML = s;
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), xh = host.querySelector('#xh');
  const show = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    let i = c.kind === 'bar' ? Math.floor((px - m.l) / slot) : Math.round((px - m.l) / (iw / Math.max(1, n - 1)));
    i = clamp(i, 0, n - 1); const d = c.days[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    tip.innerHTML = c.tip(d); tip.style.display = 'block';
    const tx = x(i) * (r.width / W); tip.style.left = clamp(tx - tip.offsetWidth / 2, 0, r.width - tip.offsetWidth) + 'px'; tip.style.top = '0px';
  };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; });
}

  const totalSec = DB.sessions.filter(s => s.uid === uid).reduce((a, s) => a + s.activeSec, 0);
  const hrs = totalSec >= 3600 ? (totalSec / 3600).toFixed(1) + '시간' : Math.round(totalSec / 60) + '분';

    <div class="tile"><div class="k">최근 7일 평균 점수</div><div class="v">${a7 == null ? '--' : a7}</div><div class="s ${delta > 0 ? 'up' : delta < 0 ? 'down' : ''}">${delta == null ? '지난 주 기록이 쌓이면 비교해 드려요' : delta === 0 ? '지난 7일과 같아요' : (delta > 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '점 (이전 7일 대비)'}</div></div>
    <div class="tile"><div class="k">누적 연습 시간</div><div class="v" style="font-size:20px;line-height:34px">${hrs}</div><div class="s">하루 목표 ${fmtKo(g)}</div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">일별 점수 · 최근 30일</h3><div class="chart" id="ch1"></div>
    <div class="note2" style="margin-top:6px">점수 = 소리를 낸 순간의 음정 정확도(목표음 또는 가장 가까운 반음 기준, 100점 만점). 컨디션·곡 난이도에 따라 오르내릴 수 있어요.</div></div>
  <div class="card"><h3 style="margin-top:0">일별 연습 시간 · 최근 30일</h3><div class="chart" id="ch2"></div>
    <div class="legend"><span><i style="background:#e48d16"></i>목표 달성한 날</span><span><i style="background:#5b6672"></i>목표 미달</span><span>┄ 하루 목표 ${fmtKo(g)}</span></div></div>
  <h3>최근 연습 기록</h3>
  <div class="card" style="padding:4px 12px">${Object.keys(days).length ? `<table><thead><tr><th>날짜</th><th class="n">점수</th><th class="n">연습 시간</th><th class="n">횟수</th></tr></thead><tbody>${
    Object.keys(days).sort().reverse().slice(0, 10).map(k => `<tr><td>${fmtDay(k)} ${days[k].met ? '<span class="up">✓</span>' : ''}</td><td class="n">${days[k].score == null ? '--' : days[k].score}</td><td class="n">${fmtKo(days[k].sec)}</td><td class="n">${days[k].n}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">아직 연습 기록이 없어요. 첫 연습을 시작해 보세요!</div>'}</div>`;
  if (scoreVals.length >= 2) {

      tip: d => `<b>${fmtDay(d.day)}</b> · ${d.v == null ? '연습 없음' : `점수 ${d.v} · ${fmtKo(d.d.sec)}`}` });

}

  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.t));   /* (11/05 사용자) 발성은 연습 화면 위쪽 버튼(자유·발성·코스·비브라토)으로 옮김 */
}
function go(t) {
  if (P.running && t !== 'practice') { toast('연습 중이에요. 먼저 "기록 끝내기"를 눌러 주세요.'); return; }
  if (P.pressed != null) releaseKey();
  if (t !== 'practice') { abortCourse(); vibReset(); }
  if (t !== 'practice' && P.mon) stopMonitor();
  cur = t; document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + t));
  const tabId = t === 'detail' ? 'roster' : t === 'scale' ? 'practice' : t; $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === tabId));
  const el = $('#v-' + t), u = me();
  if (t === 'progress') { renderProgress(el, u.id, { head: (u.demo ? '<div class="demoBar"><span>지금 보이는 날짜·점수는 <b>샘플(데모)</b>이에요</span><button class="btn sm" id="demoClr">샘플 지우고 시작</button></div>' : '') + '<h2>나의 성장 기록</h2><button class="btn sm" id="repBtn" style="margin:-4px 0 12px">📊 오늘 리포트 보기</button>' }); $('#repBtn', el).onclick = () => showReport(u.id, {});
    const dc = $('#demoClr', el); if (dc) { let arm = false; dc.onclick = () => { if (!arm) { arm = true; dc.textContent = '정말 지울까요? 한 번 더'; return; } clearDemo(); }; } }
  else if (t === 'scale') renderScale(el);
  else if (t === 'badges') renderBadges(el, u.id);
  else if (t === 'remind') renderRemind(el);
  else if (t === 'roster') renderRoster(el);
  else if (t === 'detail') renderDetail(el);
  else if (t === 'practice') { askVoice(); cache = {}; requestAnimationFrame(resize); refreshToday(); setMonUI(); if (C.mode === 'course' && C.phase !== 'play' && C.phase !== 'count') loadStage(C.stage); else renderCourseUI(); if (!P.monOff) startMonitor(false); if (C.mode === 'vib') vibEnter(); }
  if (t !== 'practice') el.scrollTop = 0;
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (['progress', 'detail'].includes(cur) && !P.running) go(cur); }, 250); });

/* (11/05 사용자) 팝업을 모두 닫은 뒤 자유 화면에서 3초 동안 소리가 없으면 '소리를 내 보세요' 팝업. 소리가 잡히면 닫고, 그 화면에선 다시 안 띄워요 */
let wvT0 = 0, wvShown = false, wvDone = false;
setInterval(() => {
  const now = performance.now(), md = $('#modal'), blocked = $('#voicePop') || $('#freePop') || (md && md.classList.contains('open')) || P.cal || !P.mon || cur !== 'practice' || C.mode !== 'free';
  if (cur !== 'practice') wvDone = false;
  if (blocked || wvDone) { wvT0 = now; if (wvShown && !wvDone) { wvShown = false; hideMicPop(); } return; }
  if (P.lastMT > now - 1200) { wvT0 = now; if (wvShown) { wvShown = false; wvDone = true; hideMicPop(); } return; }
  if (!wvShown && now - wvT0 > 3000) { wvShown = true; micPop('🎤 소리를 내 보세요', '편한 음으로 길게 \'아~\' 해 보세요'); }
}, 250);
/* ============ init ============ */
DB = loadDB();
if (SN) {   // 내 계정 모드: 샘플 없이 본인 한 명
  if (!DB || !DB.users || !user('me')) { DB = { v: 1, me: 'me', users: [{ id: 'me', name: SN.name || '나', role: 'student' }], sessions: [], settings: {}, runs: {} }; saveDB(); }
  DB.me = 'me'; if (SN.name) user('me').name = SN.name;
} else if (TM) {   // 선생님 앱 안에서 열기: 샘플 없이 '선생님' 한 명(연습 기록은 이 폰에만)
  if (!DB || !DB.users || !user('t')) { DB = { v: 1, me: 't', users: [{ id: 't', name: '선생님', role: 'student' }], sessions: [], settings: {}, runs: {} }; saveDB(); }
  DB.me = 't';
} else if (!DB || !DB.users || !user(DB.me)) seedDemo();
if (!DB.runs) DB.runs = {};
buildTabs(); go(me().role === 'student' ? 'practice' : 'roster');
renderVoiceSeg();
window.addEventListener('pagehide', () => { try { if (P.running) stopSession(); } catch (e) {} });   // 앱 안 창이 닫히거나 화면을 나가면 진행 중이던 기록을 저장
if (SN || TM) { pitchSync(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pitchSync(); }); }
if (C.mode === 'vib' && !vibUnlocked()) C.mode = 'free';
resize(); if (C.mode === 'course') loadStage(0); else renderCourseUI(); P.raf = requestAnimationFrame(loop); setTimeout(checkReminder, 1500);
window.__vn = { recAll, recSubmit, recPaint, RC, vibCue, vibRoot, vibPickRoot, vibRange, pianoVoice, pianoOut, mFreq, guideNote, setVW, VLV, follow: courseFollow, genScaleLine, scaleCfg, P, C, CFG, V, VR, genLine, loadStage, startStage, setMode, DB: () => DB, go, switchUser, badgeList, daysOf, streakInfo, stopSession, startSession, pitchSync };
})();
</script>
