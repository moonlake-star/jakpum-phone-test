<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자동 보정 A/B 듣기</title>
<style>body{font-family:sans-serif;background:#12161a;color:#eef1f5;margin:0;padding:16px;line-height:1.5;max-width:560px;margin:0 auto}h2{margin:0 0 4px}small{color:#a9b1bc}
.card{background:#1b2127;border:1px solid #2c343c;border-radius:14px;padding:14px;margin:12px 0}.q{font-size:17px;font-weight:700;margin:6px 0 10px}
button{font-size:17px;border-radius:12px;border:1px solid #3a4550;background:#232b33;color:#eef1f5;padding:14px;margin:5px 0;width:100%}button.on{background:#2d5fa8;border-color:#7fb0ff}button.play{background:#1e3a2a;border-color:#4c9a6a}button.play.pl{background:#2c7a4a}
.row{display:flex;gap:8px}.row button{flex:1}.pick button.sel{background:#7a4c0e;border-color:#ffb347}.bar{height:6px;background:#2a2f37;border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#4fd6ff}
pre{background:#0b0e11;border:1px solid #2c343c;border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap}.nav{display:flex;gap:8px}.nav button{flex:1}</style></head><body>
<h2>자동 보정 A/B 듣기</h2><small>합성 가수 소리(실제 수강생 아님) · 이어폰 권장 · 어느 쪽인지 모르게 섞여 있어요 · 고르면 자동 저장</small>
<div class="bar"><i id="pg"></i></div><div id="app"></div>
<script>
let M = null, I = 0, A = null; const KEY = "ab_v1", res = (() => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(res)); } catch {} };
const NAME = { cur: "현재 자동", smooth: "개선안(떨림 살리고 음 끝 부드럽게)", smooth70: "개선안 70%(덜 고침)" };
const $ = (s) => document.querySelector(s);
function stop() { if (A) { try { A.pause(); } catch {} A = null; } document.querySelectorAll(".play").forEach((b) => b.classList.remove("pl")); }
function play(btn, src) { const was = btn.classList.contains("pl"); stop(); if (was) return; A = new Audio(src); A.onended = () => btn.classList.remove("pl"); btn.classList.add("pl"); A.play().catch(() => btn.classList.remove("pl")); }
function render() { stop(); const c = M.cases[I], done = Object.keys(res).length; $("#pg").style.width = (done / M.cases.length * 100) + "%";
  if (I >= M.cases.length) return summary();
  const r = res[c.id];
  $("#app").innerHTML = `<div class="card"><small>${I + 1} / ${M.cases.length} · ${c.phrase}</small><div class="q">어느 쪽이 더 사람이 자연스럽게 잘 부른 것 같나요?</div>
   <button class="play" data-s="${c.orig}">▶ 원음 (보정 전)</button><div class="row"><button class="play" data-s="${c.a}">▶ A</button><button class="play" data-s="${c.b}">▶ B</button></div>
   <div class="pick"><button data-v="a" class="${r === "a" ? "sel" : ""}">A가 낫다</button><button data-v="b" class="${r === "b" ? "sel" : ""}">B가 낫다</button>
   <div class="row"><button data-v="same" class="${r === "same" ? "sel" : ""}">비슷함</button><button data-v="bad" class="${r === "bad" ? "sel" : ""}">둘 다 별로</button></div></div></div>
   <div class="nav"><button id="pv" ${I ? "" : "disabled"}>◀ 이전</button><button id="nx">${r ? "다음 ▶" : "건너뛰기 ▶"}</button></div>`;
  document.querySelectorAll(".play").forEach((b) => (b.onclick = () => play(b, b.dataset.s)));
  document.querySelectorAll(".pick button").forEach((b) => (b.onclick = () => { res[c.id] = b.dataset.v; save(); I++; render(); }));
  $("#pv").onclick = () => { I--; render(); }; $("#nx").onclick = () => { I++; render(); }; }
function summary() { const t = {}, lines = [];
  for (const c of M.cases) { const v = res[c.id]; if (!v) { lines.push(`${c.id} ${c.phrase}: 안 들음`); continue; }
    const w = v === "a" ? c.key.a : v === "b" ? c.key.b : v; lines.push(`${c.id} ${c.phrase}: ${v === "same" ? "비슷함" : v === "bad" ? "둘 다 별로" : NAME[w] + " 선택 (대결: " + NAME[c.key.a] + " vs " + NAME[c.key.b] + ")"}`); if (w in NAME) t[w] = (t[w] || 0) + 1; }
  const head = "자동 보정 A/B 결과\n" + Object.entries(t).map(([k, n]) => `${NAME[k]}: ${n}표`).join(" · ") + "\n"; const text = head + lines.join("\n");
  $("#app").innerHTML = `<div class="card"><div class="q">끝! 결과</div><pre id="o"></pre><button id="cp">결과 복사</button><button id="rs">처음부터 다시</button><button id="bk">◀ 마지막 문제로</button></div>`; $("#o").textContent = text;
  $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(text); $("#cp").textContent = "복사됨 — 채팅에 붙여넣어 주세요"; } catch { $("#cp").textContent = "복사 실패: 위 글을 길게 눌러 복사"; } };
  $("#rs").onclick = () => { for (const k in res) delete res[k]; save(); I = 0; render(); }; $("#bk").onclick = () => { I = M.cases.length - 1; render(); }; }
fetch("manifest.json").then((r) => r.json()).then((m) => { M = m; I = M.cases.findIndex((c) => !res[c.id]); if (I < 0) I = M.cases.length; render(); }).catch((e) => ($("#app").textContent = "불러오기 실패: " + e));
</script></body></html>
