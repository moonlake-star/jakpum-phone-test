<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap">
<script src="../brand.js?v=20261113-1350"></script>
<script>try { Brand.splash("student"); } catch {}</script>
<main>
  <h1><button type="button" class="fzBtn" id="fzBtn" aria-label="글씨 크기 바꾸기"><small>가</small><b>가</b></button><span class="brMark" aria-hidden="true"></span>내 보컬 노트 <span class="muted" style="font-size:.85rem">뮤직스튜디오 작품</span></h1>
  <div id="view"><p class="muted">불러오는 중…</p></div>
  <p id="lgFoot" class="muted" style="text-align:center;margin:28px 0 12px;display:none"><button type="button" id="btnLogout" class="ghost small">로그아웃</button></p>
</main>
<script src="../lesson-replies.js"></script>
<script src="../tune.js?v=20261114-2200"></script>
<script src="../pitch-embed.js?v=20261105-1850"></script>
<script>
// ── 설정(비밀값 아님): 수강생 로그인용 구글 클라이언트 ID, 노트 연결(Apps Script 웹 앱) 주소 ──
const STUDENT_CLIENT_ID = "712936245254-2itl2rolhhcsq9cdqnhku4u43hpdv2mk.apps.googleusercontent.com";
const PORTAL_URL = "https://script.google.com/macros/s/AKfycbyxHvxn4VkX83JrcGK1bQqJivhUPktWNyJn_HRpSyIyQ-lVoXh0MNaps2PUmY_obwJTBQ/exec";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// 글씨 크기(2026-10-29 사용자): 맨 위 제목 줄의 '가가'(화면에 붙어 다니지 않음) → 4단계. 고른 크기는 이 폰에 기억(sn_fz).
// 처음 1~2번 열 때만 안내를 한 번 띄우고, 크기를 한 번이라도 바꾸면 다시 안 띄움(sn_fz_hint)
const FZ = [["작게", 0.9, 15], ["보통", 1, 18], ["크게", 1.15, 21], ["아주 크게", 1.3, 24]];
function fzApply(v) { const ok = FZ.some(x => x[1] === v) ? v : 1; document.documentElement.style.setProperty("--fz", String(ok)); return ok; }
let fzLy = null;
function fzOpen() {
  fzClose(); fzLy = typeof Brand !== "undefined" && Brand.layer ? Brand.layer(() => { document.getElementById("fzSheet")?.remove(); document.getElementById("fzShade")?.remove(); fzLy = null; }) : null; const now = fzApply(LS.get("sn_fz") ?? 1);
  const sh = document.createElement("div"); sh.id = "fzShade"; sh.onclick = fzClose;
  const d = document.createElement("div"); d.id = "fzSheet"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "글씨 크기");
  d.innerHTML = `<h3>글씨 크기</h3><div class="fzRow">${FZ.map(([n, v, px]) => `<button type="button" data-fz="${v}" class="${v === now ? "on" : ""}" aria-pressed="${v === now}"><b style="font-size:${px}px">가</b>${n}</button>`).join("")}</div>
    <p>고른 크기는 이 폰에 기억돼서 다음에 열어도 그대로예요. 언제든 맨 위 ‘가가’로 바꿀 수 있어요.</p><button type="button" class="ghost fzClose">닫기</button>`;
  d.onclick = (e) => { const b = e.target.closest("[data-fz]"); if (b) { const v = fzApply(+b.dataset.fz); LS.set("sn_fz", v); LS.set("sn_fz_hint", 99);
      d.querySelectorAll("[data-fz]").forEach(x => { const on = +x.dataset.fz === v; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); }); }
    if (e.target.closest(".fzClose")) fzClose(); };
  document.body.append(sh, d); document.getElementById("fzHint")?.remove();
}
function fzClose() { if (fzLy) { const l = fzLy; fzLy = null; l.close(); return; } document.getElementById("fzSheet")?.remove(); document.getElementById("fzShade")?.remove(); }   // 뒤로 가기 = 글씨 크기 창만 닫힘
function fzHint() {
  const n = +(LS.get("sn_fz_hint") || 0); if (n >= 2 || LS.get("sn_fz") != null) return;
  LS.set("sn_fz_hint", n + 1);
  const h = document.createElement("div"); h.id = "fzHint"; h.setAttribute("role", "status"); h.textContent = "글씨가 작으면 맨 위 ‘가가’를 눌러 키울 수 있어요";
  h.onclick = () => { h.remove(); fzOpen(); }; document.body.appendChild(h); setTimeout(() => h.remove(), 6000);
}
fzApply(LS.get("sn_fz") ?? 1);
document.getElementById("fzBtn").onclick = fzOpen;
setTimeout(fzHint, 1200);
const md = (d) => d ? `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일` : "";
let idToken = null, data = null, audioCache = {};
const params = new URLSearchParams(location.search);

function exp(tok) { try { return JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000; } catch { return 0; } }
function saved() { const v = LS.get("sn_tok"); return v && exp(v) > Date.now() + 60000 ? v : null; }

// (11/09 사용자) 로그아웃 — 저장된 로그인과 구글 '자동 선택'만 끔. 읽은 표시·글씨 크기 같은 이 폰의 설정은 그대로 둠
function lgFootSet() { try { const f = document.getElementById("lgFoot"); if (f) f.style.display = idToken && data ? "" : "none"; } catch {} }
function doLogout() {
  if (!confirm("로그아웃할까요? 다시 들어오려면 구글 로그인이 필요해요.")) return;
  LS.set("sn_tok", null); idToken = null; data = null;
  try { google.accounts.id.disableAutoSelect(); } catch {}
  lgFootSet(); loginView("로그아웃했어요. 다른 구글 계정으로 들어갈 수 있어요.");
}
function loginView(msg) {
  lgFootSet();
  $("view").innerHTML = `<div class="card"><h2>로그인</h2>
    <p>선생님이 보내 드린 레슨 노트를 보려면 <b>구글 계정</b>으로 로그인해 주세요. 처음 한 번만 선생님 승인이 필요해요.</p>
    <div id="gbtn" style="margin:12px 0"></div><p class="muted">${esc(msg || "")}</p>
    <p class="muted"><a href="privacy.html" style="color:var(--accent)">개인정보 처리 안내</a></p></div>`;
  if (STUDENT_CLIENT_ID.startsWith("__")) { $("gbtn").innerHTML = `<p class="muted">아직 준비 중이에요(선생님 설정 전).</p>`; return; }
  const go = () => {
    if (!window.google?.accounts?.id) return setTimeout(go, 300);
    google.accounts.id.initialize({ client_id: STUDENT_CLIENT_ID, auto_select: true, callback: (r) => { LS.set("sn_tok", r.credential); idToken = r.credential; load(); } });
    google.accounts.id.renderButton($("gbtn"), { size: "large", text: "signin_with", shape: "pill", width: 300 });
    google.accounts.id.prompt();
  };
  go();
}

async function call(action, extra = {}) {
  const r = await fetch(PORTAL_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, id_token: idToken, ...extra }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "연결 실패");
  return j;
}

// (11/04 사용자 승인) 사용 기록 — 열기·재생·끝까지 듣기·음정선 화면 (녹음·글 내용은 안 보냄). 모아서 20초마다·화면 떠날 때 한 번에
const UT = { q: [], cur: "", t: null, on: new Map(), wired: false };
function track(k, x = {}) {
  if (!idToken || !data) return;
  const e = { k, lesson: x.lesson ?? UT.cur }; if (x.f) e.f = x.f; if (x.s != null) e.s = Math.round(x.s);
  UT.q.push(e); clearTimeout(UT.t); if (UT.q.length >= 40) utFlush(); else UT.t = setTimeout(utFlush, 20000);
}
function utFlush() {
  if (!UT.q.length || !idToken) return;
  const body = JSON.stringify({ action: "track", id_token: idToken, events: UT.q.splice(0, 60) });
  try { fetch(PORTAL_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, keepalive: true }).catch(() => {}); } catch {}
}
const utKind = (a) => a.dataset?.mka ? "makeup" : /^alb/.test(a.id) ? "album" : a.id === "fullAu" ? "full" : a.id === "allAu" ? "all" : /^au_/.test(a.id) ? "clip" : "audio";
function utStop(a, ended) {   // 재생이 멈춘 순간: 실제로 들은 시간(벽시계, 곡 길이 이하) · 90% 넘게 들었으면 '끝까지'
  const st = UT.on.get(a); if (!st) return; UT.on.delete(a);
  const sec = Math.min((performance.now() - st.t0) / 1000, a.duration || 7200);
  if (sec >= 1) track("listen", { lesson: st.lesson, f: st.f, s: sec });
  if (ended || (a.duration && a.currentTime / a.duration >= 0.9 && st.from / a.duration < 0.5)) track("done", { lesson: st.lesson, f: st.f });
}
function utWire() {
  if (UT.wired) return; UT.wired = true;
  document.addEventListener("play", (e) => { const a = e.target; if (!(a instanceof HTMLMediaElement)) return;
    if (!UT.on.has(a)) { const f = utKind(a); UT.on.set(a, { t0: performance.now(), from: a.currentTime || 0, lesson: UT.cur, f }); track("play", { f }); } }, true);
  document.addEventListener("pause", (e) => { if (e.target instanceof HTMLMediaElement) utStop(e.target, false); }, true);
  document.addEventListener("ended", (e) => { if (e.target instanceof HTMLMediaElement) utStop(e.target, true); }, true);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { [...UT.on.keys()].forEach(a => utStop(a, false)); utFlush(); } });
  try { new MutationObserver((ms) => { if (ms.some(m => [...m.addedNodes].some(n => n.id === "tuneFs"))) track("tune"); }).observe(document.body, { childList: true }); } catch {}   // 음정선 전체화면이 열린 순간
}

async function load() {
  idToken = idToken || saved();
  if (!idToken) return loginView();
  try { Brand.loading(true); } catch {}
  try {
    const j = await call("portal");
    try { Brand.loading(false); } catch {}
    if (j.state === "pending") return $("view").innerHTML = `<div class="card"><h2>가입 신청 완료 🙌</h2><p>${esc(j.name || "")}님, 선생님이 확인하시면 바로 볼 수 있어요. 승인되면 이 페이지를 다시 열어 주세요.</p></div>`;
    if (j.state === "rejected") return $("view").innerHTML = `<div class="card"><p>이 계정은 연결되지 않았어요. 선생님께 문의해 주세요.</p></div>`;
    if (j.state === "closed") return $("view").innerHTML = `<div class="card"><p>지금은 노트를 볼 수 없어요. 선생님께 문의해 주세요.</p></div>`;
    data = j; lgFootSet();
    try { utWire(); track("open", { lesson: "" }); } catch {}
    // 출석·수강권 현황(선생님 앱이 '_status' 칸으로 보냄, 2026-10-29): 레슨 목록에서는 빼고 맨 위 카드로
    const sx = (j.lessons || []).find(l => l && l.id === "_status"); data.status = sx && sx.kind === "status" ? sx : null;
    const gx = (j.lessons || []).find(l => l && l.id === "_growth"); data.growth = gx && gx.kind === "growth" ? gx : null;   // (11/02) 나의 성장
    data.months = (j.lessons || []).filter(l => l && ((String(l.id).startsWith("_month_") && l.kind === "month" && /^\d{4}-\d{2}$/.test(l.ym || "")) || (String(l.id).startsWith("_pack_") && l.kind === "pack")))
      .sort((a, b) => String(b.updated_at || b.ym || "").localeCompare(String(a.updated_at || a.ym || "")));   // (11/04) 월간 성장 리포트 · (11/05) 수강권 돌아보기 — 최근에 보낸 것이 위
    const gl = (j.lessons || []).find(l => l && l.id === "_goal"); data.goal = gl && gl.kind === "goal" && gl.title ? gl : null;   // (11/05) 🎯 목표곡
    data.lessons = (j.lessons || []).filter(l => l && l.id !== "_status" && l.id !== "_growth" && l.id !== "_goal" && !String(l.id).startsWith("_month_") && !String(l.id).startsWith("_pack_"));
    const want = params.get("l");
    if (want && data.lessons.some(l => l.id === want)) openLesson(want); else timeline();
  } catch (e) {   // 로그인 문제일 때만 저장된 로그인을 지움(오프라인·일시 오류로 매번 다시 로그인하지 않게)
    if (/로그인/.test(e.message)) { LS.set("sn_tok", null); idToken = null; return loginView(e.message); }
    $("view").innerHTML = `<div class="card"><p>연결이 잠시 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.</p><button class="full" id="retry">다시 불러오기</button><p class="muted">${esc(e.message)}</p></div>`;
    $("retry").onclick = load;
  } finally { try { Brand.loading(false); } catch {} }
}

try { document.getElementById("btnLogout").onclick = doLogout; } catch {}
const seenLocal = () => LS.get("sn_seen") || {};

// 3층 '나의 음악 이야기': 학생이 눌러야 열림. 게시된(=선생님이 승인한) 내 노트의 한마디·베스트만 날짜순으로 모아 보여줌.
// 서버에 곡 제목·성장 리포트 필드가 없으므로 곡별 묶음·'N회 성장' 요약·수치는 만들지 않음. 기록이 2회 미만이면 아예 그리지 않음.
const MAX_STORY = 6;
function storyHtml(ls) {
  const has = (x) => typeof x === "string" && x.trim() !== "";
  // 입력 순서를 믿지 않고 날짜 내림차순(YYYY-MM-DD)으로 정렬해 최근 N개를 고른 뒤 오름차순으로 보여줌(같은 날은 입력 순서 유지)
  const items = (ls || []).filter(l => l && l.date && (has(l.highlight) || l.best?.file_id))
    .map((l, i) => [l, i]).sort((a, b) => (a[0].date < b[0].date ? 1 : a[0].date > b[0].date ? -1 : a[1] - b[1]))
    .slice(0, MAX_STORY).reverse().map(x => x[0]);
  if (items.length < 2) return "";
  return `<details class="card more story"><summary>📖 나의 음악 이야기</summary>
    <p class="muted" style="margin:0 0 4px">최근 ${items.length}번의 레슨에서 선생님이 남긴 순간과 베스트예요.</p>
    ${items.map(l => `<section class="story-item" aria-label="${md(l.date)} 레슨"><div class="when">${md(l.date)}</div>
      ${has(l.highlight) ? `<p>${esc(l.highlight.trim())}</p>` : ""}${l.best?.file_id ? player(l.best.file_id + "#s", md(l.date) + " 베스트 듣기") : ""}</section>`).join("")}</details>`;
}

// ── 레슨 캘린더 공통(#182, 2026-10-29) ──
const IC_CAL = '<svg class="icCal" viewBox="0 0 24 24" width="1.05em" height="1.05em" aria-hidden="true" style="vertical-align:-.15em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';   // (11/02 사용자) 📅(숫자 17 보이는 달력 그림) 대신 숫자 없는 달력 선 그림

    ${(full && cheer) || mission.length || (full && song) ? `<div class="card cheer${mission.length || (full && song) ? " mission" : ""}">${full && cheer ? `<h2>💌 응원 메시지</h2><p class="pre" style="margin:0">${esc(cheer)}</p>` : ""}${mission.length || (full && song) ? `<h2${full && cheer ? ' class="mh"' : ""}>📋 다음 미션</h2>${mission.length ? listHtml(mission) : ""}${full && song ? `<div class="song"><div class="muted">🎵 추천 곡</div><b>${esc(song.title)}</b>${has(song.artist) ? ` <span class="muted">(${esc(song.artist)})</span>` : ""}${has(song.why) ? `<p style="margin:4px 0 0">${esc(song.why)}</p>` : ""}${yt(song.url) ? `<a class="yt" href="${esc(yt(song.url))}" target="_blank" rel="noopener noreferrer">▶ 유튜브에서 듣기</a>` : `<a class="yt find" href="https://www.youtube.com/results?search_query=${encodeURIComponent((song.title + " " + (song.artist || "")).trim())}" target="_blank" rel="noopener noreferrer">🔎 유튜브에서 찾아 듣기</a>`}</div>` : ""}` : ""}</div>` : ""}
    ${more && m === "detail" ? `<div class="card more">${more}</div>` : more && m === "normal" ? `<details class="card more"><summary>더 들여다보기</summary>${more}</details>` : ""}
    ${full && l.full && typeof l.full.file_id === "string" && Array.isArray(l.full.segs) && l.full.segs.length ? `<details class="card more fullrec" data-fid="${esc(l.full.file_id)}"><summary>📝 레슨 전체 기록 · 전사본과 녹음</summary><p class="muted" style="margin:0 0 6px">녹음을 글로 옮긴 기록이라 틀린 곳이 있을 수 있어요 · 말풍선을 누르면 아래 재생바로 그 자리부터 들려요${l.full.cut ? " · 길어서 앞부분만 실었어요" : ""}</p><div class="trs">${l.full.segs.filter(Array.isArray).map(([t, w, tx]) => { const k = ({ t: "t", s: "s", g: "g" })[w] || "x", tt = Math.max(0, +t || 0);
      return `<div class="fseg ${k === "s" ? "right" : "left"}"><div class="fbub fb-${k}" data-ft="${tt}"><span class="who">${({ t: "선생님", s: "나", g: "🎵 노래" })[k] || "·"}</span><span class="tm">${Math.floor(tt / 60)}:${String(Math.floor(tt % 60)).padStart(2, "0")}</span><span class="tx">${esc(tx)}</span></div></div>`; }).join("")}</div></details>` : ""}`;
}

function openLesson(id) {
  snSub();
  const ls = data.lessons, i = ls.findIndex(l => l.id === id), l = ls[i], prev = ls.slice(i + 1).find(x => x.best?.file_id);
  history.replaceState(history.state, "", `${location.pathname}?l=${encodeURIComponent(id)}`);
  try { UT.cur = id; track("note", { lesson: id }); } catch {}
  // 읽음: 서버에 기록된 뒤에만 이 기기에도 표시(실패하면 다음에 열 때 다시 보냄 — 감사 #53)
  if (!l.seen_at && !seenLocal()[id]) call("seen", { lesson: id }).then(() => { const s = seenLocal(); s[id] = Date.now(); LS.set("sn_seen", s); }).catch(() => {});
  const paint = () => {
    const nth = ls.length - i, dd = (l.date || "").replaceAll("-", ".");
    $("view").innerHTML = lessonHtml(l, prev, "normal")   /* 10/29 17:28 사용자: 심플/보통/자세히 버튼 없애고 보통만 */.replace('<h2 style="margin:14px 0 4px">',
      `<div class="card greet"><div class="muted">${esc(data.name)}님의 보컬노트 · ${nth}회차 · ${esc(dd)}</div><p class="big" style="margin:4px 0 0">${esc(data.name)}님, 오늘도 수고 많으셨어요 🎵</p></div><h2 style="margin:14px 0 4px">`);
    try { $("view").insertAdjacentHTML("beforeend", Brand.sign()); } catch {}   // (10/30 사용자) 노트 맨 아래 한 줄
    $("back").onclick = timeline; wirePlayers(); wireCompare(); try { if (typeof wireStems === "function") wireStems(l.makeup); } catch {}
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { LS.set("sn_mode", b.dataset.mode); paint(); });
    // 레슨별 비공개 답신(앱 #39): 이 레슨에 대해 선생님과 주고받는 글. 서버(Apps Script)가 본인 레슨인지 다시 확인
    if (typeof LessonReplies === "undefined") return;
    const replies = document.createElement("section"); replies.className = "card"; $("view").appendChild(replies);
    const allowed = [l.best, l.makeup, ...(l.clips || []), ...(l.extra_best || [])].filter(Boolean).map(x => x.file_id);
    LessonReplies.mount(replies, {
      request: (action, extra = {}) => call(action, { lesson: id, ...extra }),
      getClip: () => {
        const a = [...document.querySelectorAll("audio")].find(a => !a.paused && a.id.startsWith("au_"));
        const file_id = a?.id.slice(3).replace(/#[bsmpc]$/, "");
        return allowed.includes(file_id) && Number.isFinite(a.currentTime) ? { file_id, seconds: Math.floor(a.currentTime) } : null;
      },
      playClip: async clip => {
        if (!allowed.includes(clip.file_id)) throw new Error("현재 공개된 녹음이 아니에요.");
        let a = replies.querySelector("audio"); if (!a) { a = document.createElement("audio"); a.controls = true; replies.appendChild(a); }
        a.src = await audioUrl(clip.file_id); a.onloadedmetadata = () => { a.currentTime = clip.seconds; }; await a.play();
      }
    });
  };
  try { Brand.bar(); } catch {}
  paint();
  window.scrollTo(0, 0);
}

// 카카오톡 안 브라우저에서는 구글 로그인이 막힘 → 휴대폰 기본 브라우저로 다시 열기
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
  $("view").innerHTML = `<div class="card"><p>카카오톡 안에서는 구글 로그인이 안 돼요. 잠시 뒤 다른 브라우저로 열리지 않으면 오른쪽 위 <b>⋮ → 다른 브라우저로 열기</b>를 눌러 주세요.</p></div>`;
} else load();
</script>
