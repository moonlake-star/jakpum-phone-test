async function call(action, extra = {}) {
  const r = await fetch(PORTAL_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, id_token: idToken, ...extra }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "연결 실패");
  return j;
}

async function load() {
  idToken = idToken || saved();
  if (!idToken) return loginView();
  try { Brand.loading(true); } catch {}
  try {
    const j = await call("portal");
    try { Brand.loading(false); } catch {}
    if (j.state === "pending") return $("view").innerHTML = `<div class="card"><h2>가입 신청 완료 🙌</h2><p>${esc(j.name || "")}님, 선생님이 확인하시면 바로 볼 수 있어요. 승인되면 이 페이지를 다시 열어 주세요.</p></div>`;
    if (j.state === "rejected") return $("view").innerHTML = `<div class="card"><p>이 계정은 연결되지 않았어요. 선생님께 문의해 주세요.</p></div>`;
    if (j.state === "closed") return $("view").innerHTML = `<div class="card"><p>지금은 노트를 볼 수 없어요. 선생님께 문의해 주세요.</p></div>`;
    data = j;
    // 출석·수강권 현황(선생님 앱이 '_status' 칸으로 보냄, 2026-10-29): 레슨 목록에서는 빼고 맨 위 카드로
    const sx = (j.lessons || []).find(l => l && l.id === "_status"); data.status = sx && sx.kind === "status" ? sx : null;
    data.lessons = (j.lessons || []).filter(l => l && l.id !== "_status");
    const want = params.get("l");
    if (want && data.lessons.some(l => l.id === want)) openLesson(want); else timeline();
  } catch (e) {   // 로그인 문제일 때만 저장된 로그인을 지움(오프라인·일시 오류로 매번 다시 로그인하지 않게)
    if (/로그인/.test(e.message)) { LS.set("sn_tok", null); idToken = null; return loginView(e.message); }
    $("view").innerHTML = `<div class="card"><p>연결이 잠시 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.</p><button class="full" id="retry">다시 불러오기</button><p class="muted">${esc(e.message)}</p></div>`;
    $("retry").onclick = load;
  } finally { try { Brand.loading(false); } catch {} }
}

const MAX_STORY = 6;
function storyHtml(ls) {
  const has = (x) => typeof x === "string" && x.trim() !== "";
  // 입력 순서를 믿지 않고 날짜 내림차순(YYYY-MM-DD)으로 정렬해 최근 N개를 고른 뒤 오름차순으로 보여줌(같은 날은 입력 순서 유지)
  const items = (ls || []).filter(l => l && l.date && (has(l.highlight) || l.best?.file_id))
    .map((l, i) => [l, i]).sort((a, b) => (a[0].date < b[0].date ? 1 : a[0].date > b[0].date ? -1 : a[1] - b[1]))
    .slice(0, MAX_STORY).reverse().map(x => x[0]);
  if (items.length < 2) return "";
  return `<details class="card more story"><summary>📖 나의 음악 이야기</summary>
    <p class="muted" style="margin:0 0 4px">최근 ${items.length}번의 레슨에서 선생님이 남긴 순간과 베스트예요.</p>
    ${items.map(l => `<section class="story-item" aria-label="${md(l.date)} 레슨"><div class="when">${md(l.date)}</div>
      ${has(l.highlight) ? `<p>${esc(l.highlight.trim())}</p>` : ""}${l.best?.file_id ? player(l.best.file_id + "#s", md(l.date) + " 베스트 듣기") : ""}</section>`).join("")}</details>`;
}

function statusHtml(s, flat) {

  const n = Math.max(0, +s.lessons_confirmed || 0), i = TITLES.reduce((k, x, j) => n >= x[0] ? j : k, 0), T = TITLES[i], N = TITLES[i + 1];

  const when = nx && !isNaN(nx) ? `${nx.getMonth() + 1}월 ${nx.getDate()}일(${"일월화수목금토"[nx.getDay()]}) ${nx.getHours() < 12 ? "오전" : "오후"} ${(nx.getHours() % 12) || 12}시${nx.getMinutes() ? " " + nx.getMinutes() + "분" : ""}` : "";

function waveSvg(pk, color) {

    const flush = () => { const t = buf.join("\n").replace(/^\s*\n+|\n\s*$/g, ""); if (t.trim()) out.push(`<div class="pre">${tchip(esc(t))}</div>`); buf = []; };
    for (const ln of a) {
      const q = full && /^[ \t]*[·•\-]/.test(ln) ? ln.match(/(^|[\s·(])(\d{1,2}):([0-5]\d)(?![\d:~])/) : null, tt = q ? +q[2] * 60 + +q[3] : null;
      const c = tt == null ? null : clips.find(x => !atIds.has(x.file_id) && !inl.has(x.file_id) && clipT(x) != null && Math.abs(clipT(x) - tt) <= 5);
      if (c) inl.add(c.file_id);   // (10/29 13:22 사용자) 모든 보기에서 글 속 작은 ▶ 시각 버튼(심플과 같은 모양) — 같은 순간 소리는 '더 들어 보기'에 또 안 나옴
      buf.push(ln);
    }
    flush(); return out.join(""); };
  let letter = "", at = 0;
  for (const [a, b, w] of [ptsIn ? [bP.i, bP.j, "P"] : null, bM ? [bM.i, bM.j, "M"] : null].filter(Boolean).sort((x, y) => x[0] - y[0])) {
    if (a < at) continue; letter += txt(fbL.slice(at, a)); if (w === "P") letter += `<div class="sub">오늘 중요한 포인트</div>${ptsHtml(ptsIn)}`; at = b; }
  letter += txt(fbL.slice(at));
  const seen = new Set([...clips.map(c => c.file_id), ...pairs.map(x => x.file_id)]);
  const moreC = full ? (Array.isArray(l.more_clips) ? l.more_clips : []).filter(c => c && typeof c.file_id === "string" && c.file_id && !seen.has(c.file_id) && seen.add(c.file_id)) : [];
  const restC = [...restClips.filter(c => !inl.has(c.file_id)), ...moreC].slice(0, MAX_CLIPS);   // (10/29 13:35) 선생님이 고른 것 + 추천 클립으로 3~5개
  const more = [
    compare ? `<h3>🔁 지난번과 비교해 듣기</h3><p class="muted">${md(prev.date)} 베스트 ↔ ${md(l.date)} 베스트</p>
      <div class="ab"><div>${player(prev.best.file_id, md(prev.date))}</div><div>${player(l.best.file_id + "#b", md(l.date))}</div></div>` : "",
    extras.length ? `<h3>🎵 다른 버전</h3>${extras.map(x => player(x.file_id, x.kind_ko || "듣기")).join("")}` : "",
  ].filter(Boolean).join("");
  return `<button class="ghost" id="back">← 전체 노트</button>
    <h2 style="margin:14px 0 4px">${md(l.date)} 레슨</h2>
    ${has(l.feedback) ? `<div class="card letter"><h2>💬 선생님 한마디</h2>${letter}${bestBlock}</div>` : bestBlock ? `<div class="card">${bestBlock}</div>` : ""}
    ${full && moment && !clips.some(c => (c.note || "").trim() === moment) && !points.some(t => t.trim() === moment) ? `<div class="card moment" role="region" aria-label="선생님이 발견한 오늘의 순간"><div class="muted">🔎 선생님이 발견한 오늘의 순간</div><p class="big">${esc(moment)}</p></div>` : ""}
    ${!ptsIn && points.length ? `<div class="card"><h2>⭐ 오늘의 핵심 포인트</h2>${ptsHtml(points)}</div>` : ""}
    ${full && (restC.length || restPairs.length) ? `<div class="card listen"><h2>🎧 더 들어 보기</h2>${restC.map(c => `<div class="clip">${has(c.note) ? `<div>${esc(c.note)}</div>` : ""}${pill(c.file_id, "좋았던 순간 듣기", c.peaks)}</div>`).join("")}${restPairs.map(x => `<div class="clip"><div>${esc(x.label)}</div>${pill(x.file_id + "#p", "🔁 지도 전 → 후 듣기", x.peaks)}</div>`).join("")}</div>` : ""}
    ${full && !l.best?.file_id && makeupOk(l.makeup, l.best) ? `<div class="card makeup"><div class="cardHead"><span class="badge mk">메이크업본</span><b>간단 음정보정 예시</b>${l.makeup.len ? `<span class="muted">${l.makeup.len}초</span>` : ""}</div><p class="muted" style="margin:4px 0 6px">음원 발매용으로 정식 보정하면 더 자연스럽고 좋아져요</p>${has(l.makeup.msg) ? `<p style="margin:0 0 8px">${esc(l.makeup.msg.trim())}</p>` : ""}${(sidOk(l.makeup.before_id) || sidOk(l.makeup.curve_id)) ? mkBoxHtml(l.makeup) : pill(l.makeup.file_id + "#m", "메이크업 듣기", l.makeup.peaks, "mk")}</div>` : ""}
    ${(full && cheer) || mission.length || (full && song) ? `<div class="card cheer${mission.length || (full && song) ? " mission" : ""}">${full && cheer ? `<h2>💌 응원 메시지</h2><p class="pre" style="margin:0">${esc(cheer)}</p>` : ""}${mission.length || (full && song) ? `<h2${full && cheer ? ' class="mh"' : ""}>📋 다음 미션</h2>${mission.length ? listHtml(mission) : ""}${full && song ? `<div class="song"><div class="muted">🎵 추천 곡</div><b>${esc(song.title)}</b>${has(song.artist) ? ` <span class="muted">(${esc(song.artist)})</span>` : ""}${has(song.why) ? `<p style="margin:4px 0 0">${esc(song.why)}</p>` : ""}${yt(song.url) ? `<a class="yt" href="${esc(yt(song.url))}" target="_blank" rel="noopener noreferrer">▶ 유튜브에서 듣기</a>` : `<a class="yt find" href="https://www.youtube.com/results?search_query=${encodeURIComponent((song.title + " " + (song.artist || "")).trim())}" target="_blank" rel="noopener noreferrer">🔎 유튜브에서 찾아 듣기</a>`}</div>` : ""}` : ""}</div>` : ""}
    ${more && m === "detail" ? `<div class="card more">${more}</div>` : more && m === "normal" ? `<details class="card more"><summary>더 들여다보기</summary>${more}</details>` : ""}
    ${full && l.full && typeof l.full.file_id === "string" && Array.isArray(l.full.segs) && l.full.segs.length ? `<details class="card more fullrec" data-fid="${esc(l.full.file_id)}"><summary>📝 레슨 전체 기록 · 전사본과 녹음</summary><p class="muted" style="margin:0 0 6px">녹음을 글로 옮긴 기록이라 틀린 곳이 있을 수 있어요 · 말풍선을 누르면 아래 재생바로 그 자리부터 들려요${l.full.cut ? " · 길어서 앞부분만 실었어요" : ""}</p><div class="trs">${l.full.segs.filter(Array.isArray).map(([t, w, tx]) => { const k = ({ t: "t", s: "s", g: "g" })[w] || "x", tt = Math.max(0, +t || 0);
      return `<div class="fseg ${k === "s" ? "right" : "left"}"><div class="fbub fb-${k}" data-ft="${tt}"><span class="who">${({ t: "선생님", s: "나", g: "🎵 노래" })[k] || "·"}</span><span class="tm">${Math.floor(tt / 60)}:${String(Math.floor(tt % 60)).padStart(2, "0")}</span><span class="tx">${esc(tx)}</span></div></div>`; }).join("")}</div></details>` : ""}`;
}

function openLesson(id) {
  const ls = data.lessons, i = ls.findIndex(l => l.id === id), l = ls[i], prev = ls.slice(i + 1).find(x => x.best?.file_id);
  history.replaceState(null, "", `${location.pathname}?l=${encodeURIComponent(id)}`);
  // 읽음: 서버에 기록된 뒤에만 이 기기에도 표시(실패하면 다음에 열 때 다시 보냄 — 감사 #53)
  if (!l.seen_at && !seenLocal()[id]) call("seen", { lesson: id }).then(() => { const s = seenLocal(); s[id] = Date.now(); LS.set("sn_seen", s); }).catch(() => {});
  const paint = () => {
    const nth = ls.length - i, dd = (l.date || "").replaceAll("-", ".");
    $("view").innerHTML = lessonHtml(l, prev, "normal")   /* 10/29 17:28 사용자: 심플/보통/자세히 버튼 없애고 보통만 */.replace('<h2 style="margin:14px 0 4px">',
      `<div class="card greet"><div class="muted">${esc(data.name)}님의 보컬노트 · ${nth}회차 · ${esc(dd)}</div><p class="big" style="margin:4px 0 0">${esc(data.name)}님, 오늘도 수고 많으셨어요 🎵</p></div><h2 style="margin:14px 0 4px">`);
    try { $("view").insertAdjacentHTML("beforeend", Brand.sign()); } catch {}   // (10/30 사용자) 노트 맨 아래 한 줄
    $("back").onclick = timeline; wirePlayers();
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { LS.set("sn_mode", b.dataset.mode); paint(); });
    // 레슨별 비공개 답신(앱 #39): 이 레슨에 대해 선생님과 주고받는 글. 서버(Apps Script)가 본인 레슨인지 다시 확인
    if (typeof LessonReplies === "undefined") return;
    const replies = document.createElement("section"); replies.className = "card"; $("view").appendChild(replies);
    const allowed = [l.best, l.makeup, ...(l.clips || []), ...(l.extra_best || [])].filter(Boolean).map(x => x.file_id);
    LessonReplies.mount(replies, {
      request: (action, extra = {}) => call(action, { lesson: id, ...extra }),
      getClip: () => {
        const a = [...document.querySelectorAll("audio")].find(a => !a.paused && a.id.startsWith("au_"));
        const file_id = a?.id.slice(3).replace(/#[bsmp]$/, "");
        return allowed.includes(file_id) && Number.isFinite(a.currentTime) ? { file_id, seconds: Math.floor(a.currentTime) } : null;
      },
      playClip: async clip => {
        if (!allowed.includes(clip.file_id)) throw new Error("현재 공개된 녹음이 아니에요.");
        let a = replies.querySelector("audio"); if (!a) { a = document.createElement("audio"); a.controls = true; replies.appendChild(a); }
        a.src = await audioUrl(clip.file_id); a.onloadedmetadata = () => { a.currentTime = clip.seconds; }; await a.play();
      }
    });
  };
  try { Brand.bar(); } catch {}
  paint();
  window.scrollTo(0, 0);
}

// 카카오톡 안 브라우저에서는 구글 로그인이 막힘 → 휴대폰 기본 브라우저로 다시 열기
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
  $("view").innerHTML = `<div class="card"><p>카카오톡 안에서는 구글 로그인이 안 돼요. 잠시 뒤 다른 브라우저로 열리지 않으면 오른쪽 위 <b>⋮ → 다른 브라우저로 열기</b>를 눌러 주세요.</p></div>`;
} else load();
</script>
