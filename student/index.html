<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 보컬 노트 · 작품</title>
<meta name="theme-color" content="#17191d">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root { color-scheme:dark; --bg:#17191d; --fg:#eceff3; --muted:#a9b1bc; --card:#22262c; --line:#363c45; --accent:#9cc3ff; --on-accent:#10141a; --good:#7fd99a; }
  * { box-sizing:border-box; }
  html { font-size:calc(16px * var(--fz, 1)); }   /* 글씨 크기(2026-10-29): rem 글자와 본문 19px을 같은 비율로 */
  body { margin:0; word-break:keep-all; overflow-wrap:anywhere; background:var(--bg); color:var(--fg); font:calc(19px * var(--fz, 1))/1.6 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  h1 .fzBtn { float:right; min-height:44px; padding:0 14px; border-radius:22px; background:transparent; color:var(--fg); border:1.5px solid #465062; font-size:16px; font-weight:700; }
  h1 .fzBtn small { font-size:12px; } h1 .fzBtn b { font-size:20px; }
  #fzSheet { position:fixed; left:0; right:0; bottom:0; z-index:60; max-width:640px; margin:0 auto; background:var(--card); border-top:1.5px solid var(--accent); border-radius:18px 18px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px #0008; font-size:16px; animation:fzUp .25s ease; }
  @keyframes fzUp { from { transform:translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }
  #fzShade { position:fixed; inset:0; z-index:59; background:#0009; }
  #fzSheet h3 { margin:0 0 10px; font-size:18px; } #fzSheet .fzRow { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  #fzSheet .fzRow button { min-height:68px; padding:0 4px; border-radius:14px; border:1.5px solid #465062; background:#1b1f26; color:var(--fg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px; }
  #fzSheet .fzRow button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); } #fzSheet .fzRow b { line-height:1.1; }
  #fzSheet p { color:var(--muted); font-size:14px; margin:10px 0 0; } #fzSheet .fzClose { width:100%; margin-top:10px; min-height:48px; font-size:16px; }
  #fzHint { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:55; max-width:92vw; background:#2f3a4a; color:var(--fg); border:1px solid var(--accent); border-radius:14px; padding:10px 14px; font-size:16px; box-shadow:0 4px 14px #0008; cursor:pointer; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.35rem; margin:4px 0 12px; } h2 { font-size:1.2rem; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
  .muted { color:var(--muted); font-size:.9rem; }
  button { font:inherit; min-height:52px; border-radius:14px; border:0; background:var(--accent); color:var(--on-accent); font-weight:700; padding:0 18px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:2px solid var(--accent); }
  .full { width:100%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .moment { border:2px solid var(--accent); } .big { font-size:1.25rem; line-height:1.55; margin:6px 0 0; font-weight:600; }
  h3 { font-size:1.05rem; margin:16px 0 6px; } .clip { margin:10px 0; }
  details.more > summary { min-height:56px; display:flex; align-items:center; font-weight:700; font-size:1.1rem; color:var(--accent); cursor:pointer; }
  details.more[open] > summary { margin-bottom:4px; }
  @media (max-width:360px) { body { font-size:18px; } main { padding:12px; } .ab { grid-template-columns:1fr; } }
  .lesson { display:block; width:100%; text-align:left; background:var(--card); color:var(--fg); border:1px solid var(--line); margin:10px 0; padding:14px 16px; min-height:64px; font-weight:400; }
  .lesson b { font-size:1.05rem; } .new { color:var(--good); font-weight:700; }
  .play { width:100%; min-height:64px; font-size:1.1rem; }
  .pre { white-space:pre-wrap; }
  /* 레슨 전체 기록(2026-10-29): V1 선생님 앱처럼 말풍선(선생님 왼쪽·나 오른쪽·노래 보라), 누르면 화면 아래 재생바가 올라옴 */
  .fullrec .trs { max-height:70vh; overflow-y:auto; padding:2px; }
  .fseg { display:flex; margin:6px 0; } .fseg.right { justify-content:flex-end; }
  .fbub { max-width:86%; padding:8px 12px; border-radius:14px; cursor:pointer; border:2px solid transparent; line-height:1.5; }
  .fseg.left .fbub { border-top-left-radius:4px; } .fseg.right .fbub { border-top-right-radius:4px; }
  .fb-t { background:#1f3050; } .fb-t .who { color:#a9c7ff; } .fb-s { background:#3d2c17; } .fb-s .who { color:#ffc677; }
  .fb-g { background:#31224a; } .fb-g .who { color:#dcb3ff; } .fb-x { background:#2a2f37; } .fb-x .who { color:#c0c7d1; }
  .fbub .who { font-weight:700; font-size:.88rem; } .fbub .tm { color:#a9b1bc; font-size:.76rem; margin-left:6px; } .fbub .tx { display:block; }
  .fbub.now { border-color:#ffd27a; }
  .tchip { display:inline-flex; align-items:center; min-height:34px; padding:0 10px; margin:2px 0; border-radius:14px; background:#1d2b40; color:#9cc3ff; border:1.5px solid #3a5a8a; font-size:.9rem; font-weight:700; vertical-align:1px; }
  .bestTop { border:2px solid var(--accent); }
  #fullBar { position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:760px; margin:0 auto; background:#22262c; border-top:1px solid #363c45; box-shadow:0 -4px 14px rgba(0,0,0,.4);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:4px; transform:translateY(110%); transition:transform .25s ease; }
  #fullBar.on { transform:none; } body.fbOn { padding-bottom:140px; }
  #fullBar .r { display:flex; gap:6px; align-items:center; } #fullBar .lab { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#a9b1bc; font-size:.9rem; }
  #fullBar button { min-height:42px; min-width:48px; border-radius:12px; border:1.5px solid #465062; background:#1b1f26; color:#eceff3; font:700 1rem system-ui; }
  #fullBar #fbPlay { background:#9cc3ff; color:#10141a; border-color:#9cc3ff; min-width:64px; } #fullBar .t { min-width:5.5em; text-align:center; color:#a9b1bc; font-variant-numeric:tabular-nums; }
  #fullBar input { width:100%; }
  audio { width:100%; margin-top:8px; }
  ul { padding-left:1.2em; margin:6px 0; }
  .ab { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hidden { display:none; }
  /* 10/28 승인 시안(다크 통일): 카드 머리·배지·보기 방식(심플/보통/자세히)·추천곡·응원 */
  .seg { display:flex; gap:6px; margin:8px 0 4px; } .seg button { flex:1; min-height:46px; padding:0 8px; background:transparent; color:var(--accent); border:2px solid var(--line); font-size:1rem; }
  .seg button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .cardHead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .cardHead b { font-size:1.1rem; }
  .badge { font-size:.75rem; font-weight:800; padding:2px 8px; border-radius:6px; background:#e2475a; color:#fff; } .badge.mk { background:#7a4fd6; }
  .song { margin-top:10px; padding:10px 12px; border-radius:12px; background:#1b1e23; border:1px solid var(--line); }
  .cheer { border-color:#b98ad6; }
  .wave { position:relative; height:56px; margin:4px 0 8px; cursor:pointer; touch-action:manipulation; }
  .aud { display:flex; align-items:center; gap:10px; background:#11141a; border-radius:14px; padding:7px 10px; } .aud .wave { flex:1; min-width:0; margin:0; height:28px; } .aud .flat { flex:1; min-width:0; height:2px; background:#3a414b; border-radius:1px; }
  .rp { flex:none; width:48px; height:40px; min-height:40px; padding:0; border-radius:10px; font-size:1.05rem; }   /* 10/29 사용자: 선생님 화면 버튼처럼 둥근 네모·낮게 */ .makeup .rp { background:#9b5cff; color:#fff; }
  .tm { text-align:right; margin:4px 2px 0; }
  /* (10/29 확정) 둥근 듣기 버튼 — 접힌 알약, 누르면 그 줄 폭으로 펼쳐지며 파형 */
  .lp { display:inline-flex; align-items:center; gap:10px; max-width:100%; min-height:46px; margin:2px 0; padding:0 18px 0 5px; border-radius:999px; border:0; background:linear-gradient(135deg, rgba(156,195,255,.16), rgba(156,195,255,.06)); box-shadow:inset 0 0 0 1px rgba(156,195,255,.14); color:var(--accent); font-size:.9rem; font-weight:600; overflow:hidden; box-sizing:border-box; vertical-align:middle; transition:width 300ms cubic-bezier(.3,.7,.2,1), background 300ms ease, padding 300ms ease; }
  .lp:active { transform:scale(.98); }
  .lp .ic { flex:none; width:36px; height:36px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #c4dcff, var(--accent) 70%); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:.8rem; box-shadow:0 2px 10px rgba(156,195,255,.35); }
  .lp.mk { color:#c9a6ff; background:linear-gradient(135deg, rgba(201,166,255,.18), rgba(201,166,255,.06)); box-shadow:inset 0 0 0 1px rgba(201,166,255,.16); } .lp.mk .ic { background:radial-gradient(circle at 35% 30%, #e3d1ff, #c9a6ff 70%); box-shadow:0 2px 10px rgba(201,166,255,.35); }
  .lp .lab { white-space:nowrap; } .lp .wv, .lp .tm { display:none; }
  .lp.open { display:flex; width:100%; padding:5px 14px 5px 5px; background:linear-gradient(135deg, rgba(156,195,255,.10), rgba(17,20,26,.9)); }
  .lp.mk.open { background:linear-gradient(135deg, rgba(201,166,255,.12), rgba(17,20,26,.9)); }
  .lp.open .lab { display:none; } .lp.open .wv { display:block; position:relative; flex:1; min-width:0; height:28px; } .lp.open .tm { display:block; flex:none; margin:0; font-size:.78rem; color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; }
  .lp .wv svg { position:absolute; inset:0; width:100%; height:100%; } .lp .wv .on { position:absolute; inset:0; clip-path:inset(0 100% 0 0); } .lp .wv .flat { position:absolute; left:0; right:0; top:50%; height:2px; margin-top:-1px; background:#3a414b; border-radius:1px; }
  .best { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  ol.pts { list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:14px; } ol.pts li { display:flex; flex-direction:column; align-items:flex-start; gap:6px; } ol.pts .pt { display:flex; gap:8px; } ol.pts .pt b { color:var(--accent); flex:none; }
  .cap { font-size:.82rem; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { .lp { transition:none; } }
  .wave svg { position:absolute; inset:0; width:100%; height:100%; } .wave .on { position:absolute; inset:0; clip-path:inset(0 100% 0 0); }
  .story-item { border-top:1px solid var(--line); padding:12px 0; } .story-item .when { font-weight:700; } .story-item p { margin:4px 0 8px; }
  @media (max-width:360px) { .story-item .play { font-size:1rem; padding:0 12px; } }
</style>
</head>
<body>
<main>
  <h1><button type="button" class="fzBtn" id="fzBtn" aria-label="글씨 크기 바꾸기"><small>가</small><b>가</b></button>🎤 내 보컬 노트 <span class="muted" style="font-size:.85rem">뮤직스튜디오 작품</span></h1>
  <div id="view"><p class="muted">불러오는 중…</p></div>
</main>
<script src="../lesson-replies.js"></script>
<script>
// ── 설정(비밀값 아님): 수강생 로그인용 구글 클라이언트 ID, 노트 연결(Apps Script 웹 앱) 주소 ──
const STUDENT_CLIENT_ID = "712936245254-2itl2rolhhcsq9cdqnhku4u43hpdv2mk.apps.googleusercontent.com";
const PORTAL_URL = "https://script.google.com/macros/s/AKfycbyxHvxn4VkX83JrcGK1bQqJivhUPktWNyJn_HRpSyIyQ-lVoXh0MNaps2PUmY_obwJTBQ/exec";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// 글씨 크기(2026-10-29 사용자): 맨 위 제목 줄의 '가가'(화면에 붙어 다니지 않음) → 4단계. 고른 크기는 이 폰에 기억(sn_fz).
// 처음 1~2번 열 때만 안내를 한 번 띄우고, 크기를 한 번이라도 바꾸면 다시 안 띄움(sn_fz_hint)
const FZ = [["작게", 0.9, 15], ["보통", 1, 18], ["크게", 1.15, 21], ["아주 크게", 1.3, 24]];
function fzApply(v) { const ok = FZ.some(x => x[1] === v) ? v : 1; document.documentElement.style.setProperty("--fz", String(ok)); return ok; }
function fzOpen() {
  fzClose(); const now = fzApply(LS.get("sn_fz") ?? 1);
  const sh = document.createElement("div"); sh.id = "fzShade"; sh.onclick = fzClose;
  const d = document.createElement("div"); d.id = "fzSheet"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "글씨 크기");
  d.innerHTML = `<h3>글씨 크기</h3><div class="fzRow">${FZ.map(([n, v, px]) => `<button type="button" data-fz="${v}" class="${v === now ? "on" : ""}" aria-pressed="${v === now}"><b style="font-size:${px}px">가</b>${n}</button>`).join("")}</div>
    <p>고른 크기는 이 폰에 기억돼서 다음에 열어도 그대로예요. 언제든 맨 위 ‘가가’로 바꿀 수 있어요.</p><button type="button" class="ghost fzClose">닫기</button>`;
  d.onclick = (e) => { const b = e.target.closest("[data-fz]"); if (b) { const v = fzApply(+b.dataset.fz); LS.set("sn_fz", v); LS.set("sn_fz_hint", 99);
      d.querySelectorAll("[data-fz]").forEach(x => { const on = +x.dataset.fz === v; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); }); }
    if (e.target.closest(".fzClose")) fzClose(); };
  document.body.append(sh, d); document.getElementById("fzHint")?.remove();
}
function fzClose() { document.getElementById("fzSheet")?.remove(); document.getElementById("fzShade")?.remove(); }
function fzHint() {
  const n = +(LS.get("sn_fz_hint") || 0); if (n >= 2 || LS.get("sn_fz") != null) return;
  LS.set("sn_fz_hint", n + 1);
  const h = document.createElement("div"); h.id = "fzHint"; h.setAttribute("role", "status"); h.textContent = "글씨가 작으면 맨 위 ‘가가’를 눌러 키울 수 있어요";
  h.onclick = () => { h.remove(); fzOpen(); }; document.body.appendChild(h); setTimeout(() => h.remove(), 6000);
}
fzApply(LS.get("sn_fz") ?? 1);
document.getElementById("fzBtn").onclick = fzOpen;
setTimeout(fzHint, 1200);
const md = (d) => d ? `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일` : "";
let idToken = null, data = null, audioCache = {};
const params = new URLSearchParams(location.search);

function exp(tok) { try { return JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000; } catch { return 0; } }
function saved() { const v = LS.get("sn_tok"); return v && exp(v) > Date.now() + 60000 ? v : null; }

function loginView(msg) {
  $("view").innerHTML = `<div class="card"><h2>로그인</h2>
    <p>선생님이 보내 드린 레슨 노트를 보려면 <b>구글 계정</b>으로 로그인해 주세요. 처음 한 번만 선생님 승인이 필요해요.</p>
    <div id="gbtn" style="margin:12px 0"></div><p class="muted">${esc(msg || "")}</p>
    <p class="muted"><a href="privacy.html" style="color:var(--accent)">개인정보 처리 안내</a></p></div>`;
  if (STUDENT_CLIENT_ID.startsWith("__")) { $("gbtn").innerHTML = `<p class="muted">아직 준비 중이에요(선생님 설정 전).</p>`; return; }
  const go = () => {
    if (!window.google?.accounts?.id) return setTimeout(go, 300);
    google.accounts.id.initialize({ client_id: STUDENT_CLIENT_ID, auto_select: true, callback: (r) => { LS.set("sn_tok", r.credential); idToken = r.credential; load(); } });
    google.accounts.id.renderButton($("gbtn"), { size: "large", text: "signin_with", shape: "pill", width: 300 });
    google.accounts.id.prompt();
  };
  go();
}

async function call(action, extra = {}) {
  const r = await fetch(PORTAL_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, id_token: idToken, ...extra }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "연결 실패");
  return j;
}

async function load() {
  idToken = idToken || saved();
  if (!idToken) return loginView();
  try {
    const j = await call("portal");
    if (j.state === "pending") return $("view").innerHTML = `<div class="card"><h2>가입 신청 완료 🙌</h2><p>${esc(j.name || "")}님, 선생님이 확인하시면 바로 볼 수 있어요. 승인되면 이 페이지를 다시 열어 주세요.</p></div>`;
    if (j.state === "rejected") return $("view").innerHTML = `<div class="card"><p>이 계정은 연결되지 않았어요. 선생님께 문의해 주세요.</p></div>`;
    if (j.state === "closed") return $("view").innerHTML = `<div class="card"><p>지금은 노트를 볼 수 없어요. 선생님께 문의해 주세요.</p></div>`;
    data = j;
    const want = params.get("l");
    if (want && j.lessons.some(l => l.id === want)) openLesson(want); else timeline();
  } catch (e) {   // 로그인 문제일 때만 저장된 로그인을 지움(오프라인·일시 오류로 매번 다시 로그인하지 않게)
    if (/로그인/.test(e.message)) { LS.set("sn_tok", null); idToken = null; return loginView(e.message); }
    $("view").innerHTML = `<div class="card"><p>연결이 잠시 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.</p><button class="full" id="retry">다시 불러오기</button><p class="muted">${esc(e.message)}</p></div>`;
    $("retry").onclick = load;
  }
}

const seenLocal = () => LS.get("sn_seen") || {};

// 3층 '나의 음악 이야기': 학생이 눌러야 열림. 게시된(=선생님이 승인한) 내 노트의 한마디·베스트만 날짜순으로 모아 보여줌.
// 서버에 곡 제목·성장 리포트 필드가 없으므로 곡별 묶음·'N회 성장' 요약·수치는 만들지 않음. 기록이 2회 미만이면 아예 그리지 않음.
const MAX_STORY = 6;
function storyHtml(ls) {
  const has = (x) => typeof x === "string" && x.trim() !== "";
  // 입력 순서를 믿지 않고 날짜 내림차순(YYYY-MM-DD)으로 정렬해 최근 N개를 고른 뒤 오름차순으로 보여줌(같은 날은 입력 순서 유지)
  const items = (ls || []).filter(l => l && l.date && (has(l.highlight) || l.best?.file_id))
    .map((l, i) => [l, i]).sort((a, b) => (a[0].date < b[0].date ? 1 : a[0].date > b[0].date ? -1 : a[1] - b[1]))
    .slice(0, MAX_STORY).reverse().map(x => x[0]);
  if (items.length < 2) return "";
  return `<details class="card more story"><summary>📖 나의 음악 이야기</summary>

    ${has(l.feedback) ? `<div class="card"><h2>💬 선생님 한마디</h2><div class="pre">${tchip(esc(l.feedback))}</div>${bestBlock}</div>` : bestBlock ? `<div class="card">${bestBlock}</div>` : ""}
    ${full && moment ? `<div class="card moment" role="region" aria-label="선생님이 발견한 오늘의 순간"><div class="muted">🔎 선생님이 발견한 오늘의 순간</div><p class="big">${esc(moment)}</p></div>` : ""}
    ${points.length ? `<div class="card"><h2>⭐ 오늘의 핵심 포인트</h2><ol class="pts">${points.map((t, i) => `<li><div class="pt"><b>${i + 1}</b><span>${esc(t)}</span></div>${psnd.filter(x => x.p === i).slice(0, 2).map(x => x.kind === "pair" ? pill(x.file_id + "#p", "🔁 지도 전 → 후 듣기", x.peaks || peakOf(x.file_id)) + `<div class="cap">지도 전 → 지도 후 순서로 들려요</div>` : pill(x.file_id, "좋았던 순간 듣기", x.peaks || peakOf(x.file_id))).join("")}</li>`).join("")}</ol></div>` : ""}
    ${practice.length || (full && song) ? `<div class="card"><h2>📋 다음 미션</h2>${practice.length ? listHtml(practice) : ""}${full && song ? `<div class="song"><div class="muted">🎵 추천 곡</div><b>${esc(song.title)}</b>${has(song.artist) ? ` <span class="muted">(${esc(song.artist)})</span>` : ""}${has(song.why) ? `<p style="margin:4px 0 0">${esc(song.why)}</p>` : ""}</div>` : ""}</div>` : ""}
    ${full && (restClips.length || restPairs.length) ? `<div class="card listen"><h2>🎧 더 들어 보기</h2>${restClips.map(c => `<div class="clip">${has(c.note) ? `<div>${esc(c.note)}</div>` : ""}${pill(c.file_id, "좋았던 순간 듣기", c.peaks)}</div>`).join("")}${restPairs.map(x => `<div class="clip"><div>${esc(x.label)}</div>${pill(x.file_id + "#p", "🔁 지도 전 → 후 듣기", x.peaks)}</div>`).join("")}</div>` : ""}
    ${full && makeupOk(l.makeup, l.best) ? `<div class="card makeup"><div class="cardHead"><span class="badge mk">메이크업본</span><b>간단 음정보정 예시</b>${l.makeup.len ? `<span class="muted">${l.makeup.len}초</span>` : ""}</div><p class="muted" style="margin:4px 0 6px">음원 발매용으로 정식 보정하면 더 자연스럽고 좋아져요</p>${has(l.makeup.msg) ? `<p style="margin:0 0 8px">${esc(l.makeup.msg.trim())}</p>` : ""}${pill(l.makeup.file_id + "#m", "메이크업 듣기", l.makeup.peaks, "mk")}</div>` : ""}
    ${full && cheer ? `<div class="card cheer"><h2>💌 응원 메시지</h2><p class="pre" style="margin:0">${esc(cheer)}</p></div>` : ""}
    ${more && m === "detail" ? `<div class="card more">${more}</div>` : more && m === "normal" ? `<details class="card more"><summary>더 들여다보기</summary>${more}</details>` : ""}
    ${full && l.full && typeof l.full.file_id === "string" && Array.isArray(l.full.segs) && l.full.segs.length ? `<details class="card more fullrec" data-fid="${esc(l.full.file_id)}"><summary>📝 레슨 전체 기록 · 전사본과 녹음</summary><p class="muted" style="margin:0 0 6px">AI가 받아쓴 글이라 틀린 곳이 있을 수 있어요 · 말풍선을 누르면 아래 재생바로 그 자리부터 들려요${l.full.cut ? " · 길어서 앞부분만 실었어요" : ""}</p><div class="trs">${l.full.segs.filter(Array.isArray).map(([t, w, tx]) => { const k = ({ t: "t", s: "s", g: "g" })[w] || "x", tt = Math.max(0, +t || 0);
      return `<div class="fseg ${k === "s" ? "right" : "left"}"><div class="fbub fb-${k}" data-ft="${tt}"><span class="who">${({ t: "선생님", s: "나", g: "🎵 노래" })[k] || "·"}</span><span class="tm">${Math.floor(tt / 60)}:${String(Math.floor(tt % 60)).padStart(2, "0")}</span><span class="tx">${esc(tx)}</span></div></div>`; }).join("")}</div></details>` : ""}`;
}

function openLesson(id) {
  const ls = data.lessons, i = ls.findIndex(l => l.id === id), l = ls[i], prev = ls.slice(i + 1).find(x => x.best?.file_id);
  history.replaceState(null, "", `${location.pathname}?l=${encodeURIComponent(id)}`);
  // 읽음: 서버에 기록된 뒤에만 이 기기에도 표시(실패하면 다음에 열 때 다시 보냄 — 감사 #53)
  if (!l.seen_at && !seenLocal()[id]) call("seen", { lesson: id }).then(() => { const s = seenLocal(); s[id] = Date.now(); LS.set("sn_seen", s); }).catch(() => {});
  const paint = () => {
    const nth = ls.length - i, dd = (l.date || "").replaceAll("-", ".");
    $("view").innerHTML = lessonHtml(l, prev, LS.get("sn_mode") || "normal").replace('<h2 style="margin:14px 0 4px">',
      `<div class="card greet"><div class="muted">${esc(data.name)}님의 보컬노트 · ${nth}회차 · ${esc(dd)}</div><p class="big" style="margin:4px 0 0">${esc(data.name)}님, 오늘도 수고 많으셨어요 🎵</p></div><h2 style="margin:14px 0 4px">`);
    $("back").onclick = timeline; wirePlayers();
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { LS.set("sn_mode", b.dataset.mode); paint(); });
    // 레슨별 비공개 답신(앱 #39): 이 레슨에 대해 선생님과 주고받는 글. 서버(Apps Script)가 본인 레슨인지 다시 확인
    if (typeof LessonReplies === "undefined") return;
    const replies = document.createElement("section"); replies.className = "card"; $("view").appendChild(replies);
    const allowed = [l.best, l.makeup, ...(l.clips || []), ...(l.extra_best || [])].filter(Boolean).map(x => x.file_id);
    LessonReplies.mount(replies, {
      request: (action, extra = {}) => call(action, { lesson: id, ...extra }),
      getClip: () => {
        const a = [...document.querySelectorAll("audio")].find(a => !a.paused && a.id.startsWith("au_"));
        const file_id = a?.id.slice(3).replace(/#[bsmp]$/, "");
        return allowed.includes(file_id) && Number.isFinite(a.currentTime) ? { file_id, seconds: Math.floor(a.currentTime) } : null;
      },
      playClip: async clip => {
        if (!allowed.includes(clip.file_id)) throw new Error("현재 공개된 녹음이 아니에요.");
        let a = replies.querySelector("audio"); if (!a) { a = document.createElement("audio"); a.controls = true; replies.appendChild(a); }
        a.src = await audioUrl(clip.file_id); a.onloadedmetadata = () => { a.currentTime = clip.seconds; }; await a.play();
      }
    });
  };
  paint();
  window.scrollTo(0, 0);
}

// 카카오톡 안 브라우저에서는 구글 로그인이 막힘 → 휴대폰 기본 브라우저로 다시 열기
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
  $("view").innerHTML = `<div class="card"><p>카카오톡 안에서는 구글 로그인이 안 돼요. 잠시 뒤 다른 브라우저로 열리지 않으면 오른쪽 위 <b>⋮ → 다른 브라우저로 열기</b>를 눌러 주세요.</p></div>`;
} else load();
</script>
