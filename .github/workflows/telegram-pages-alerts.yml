name: Telegram Pages deployment alerts

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_RESULT: ${{ github.event.deployment_status.state }}
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing"
            exit 1
          fi
          # 무엇이 바뀌었는지: 병합된 커밋 메시지(한국어 제목 + 본문 몇 줄). 커밋 번호·링크는 넣지 않음(사용자 요청 2026-10-27)
          summary() {
            local msg
            msg=$(gh api "repos/${REPOSITORY}/commits/${DEPLOY_SHA}" --jq .commit.message 2>/dev/null || true)
            [[ -z "$msg" ]] && { echo "(바뀐 내용을 불러오지 못했어요)"; return; }
            local title body
            title=$(printf '%s\n' "$msg" | head -n1 | sed -E 's/ \(#[0-9]+\)$//; s/^(feat|fix|chore|docs|refactor|test)(\([^)]*\))?: //')
            body=$(printf '%s\n' "$msg" | tail -n +2 | grep -viE '^\s*$|co-authored-by|claude-session|generated with|https?://|^-{3,}' | head -n 6 | sed -E 's/^[-*•] ?/· /' || true)
            printf '%s\n%s' "• ${title}" "$body"
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MESSAGE="🔔 작품 보컬노트 텔레그램 알림 연결 테스트입니다. 실제 배포 완료 알림은 아닙니다."
          elif [[ "$DEPLOY_RESULT" == "success" ]]; then
            MESSAGE="✅ 선생님 앱에 적용됐어요
          $(summary)

          앱을 새로고침하면 바로 보여요."
          else
            MESSAGE="❌ 선생님 앱 적용 실패 — 앱은 이전 상태 그대로예요
          $(summary)"
          fi
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
          echo "Telegram API accepted notification"
