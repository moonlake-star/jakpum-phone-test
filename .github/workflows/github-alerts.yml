name: VocalNote - GitHub mobile alerts
on:
  pull_request:
    types: [closed]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'deployment_status' && github.event.deployment.environment == 'github-pages' && contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-alert-${{ github.event_name }}-${{ github.event.pull_request.merge_commit_sha || github.event.deployment.sha || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          VOCALNOTE_ALERT_ISSUE: '566'
        with:
          script: |
            const notify = require('./.github/scripts/notify.js');
            await notify({ github, context, core });
